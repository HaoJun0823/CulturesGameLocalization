stringn 0 "@HILF DEN ESKIMOS, VEREINE DIE VÖLKER!"
stringn 1 "Baue eine kleine Siedlung auf."
stringn 2 "Suche den Stamm der Graukimos und Gelbimos auf."
stringn 3 "Gehe zur Näherei."
stringn 4 "Gehe zu den Nornen im Westen."
stringn 5 "Suche eine Möglichkeit den Regen zu vertreiben und Schnee herbeizurufen."
stringn 6 "Suche nach einer friedlichen Einigung."
stringn 7 "Liefere 10 Kuchen an die Graukimos zum Tribut!"
stringn 8 "Liefere 10 Met an die Gelbimos zum Tribut!"
stringn 9 "Gib den Wikinger 15 Säcke Wolle zum Tribut."
stringn 10 "Bringe die Eskimos zur Näherei, wenn die Stämme befreundet sind!"
stringn 11 "Bringe die roten Eskimos zu den Schwarzimos."
