stringn 29 "Ein Steinmetz sucht die Umgebung der Steinmetzh黷te 1 nach Bruchstein ab und verarbeitet ihn zu Steinbl鯿ken. Das Geb鋟de sollte deshalb in der N鋒e von Bruchstein errichtet werden."
