[text]
stringn 0 "Suche einen geeigneten Landeplatz."
stringn 1 "Baue eine kleine Siedlung auf."
stringn 2 "Bringe 100 Steine und 50 Marmorblöcke zum Leuchtturm."
stringn 3 "Befreie den Architekten Sostratos."
stringn 4 "Zahle den Vagabunden 150 Münzen und 10 Met oder bekämpfe sie."
stringn 5 "Zahle den Vagabunden weitere 10 Met oder bekämpfe sie."
stringn 6 "Durchsuche das Vagabundenlager."
stringn 7 "Bringe Sostratos zum Leuchturm."
stringn 8 "Finde das heilige Feuer."
stringn 9 "Zahle dem Bergvolk 15 große Heiltränke Tribut oder bekämpfe sie."
stringn 10 "Bringe das Feuer mit einem Helden zum Leuchtturm."
stringn 11 "Handele mit den Wikingern 5 Langschwerter."
stringn 12 "@BEFESTIGE DEN LEUCHTURM VON PHAROS!"
stringn 13 "Reiche den Wikingern 10 Verteidigungsamulette zum Tribut."
stringn 19 "Zahle den Nomaden 15 große Heiltränke Tribut."
