[text]
stringn 0 "@ERRICHTE DEN ARTEMIS TEMPEL ZU EPHESOS."
stringn 1 "Baue eine kleine Siedlung auf."
stringn 2 "Gehe zum Tempelbauplatz."
stringn 3 "Suche eine Möglichkeit den Sumpf zurückzudrängen und den Tempelbauplatz zu befestigen."
stringn 4 "Bringe 127 Marmorsäulen zum Tempelbauplatz."
stringn 5 "Zahle dem Hafenvolk 15 Eisenwerkzeuge zum Tribut."
stringn 6 "Gib den Soldaten 15 Met zum Tribut für ihre Unterstützung."
stringn 7 "Suche Amelia."
stringn 8 "Bringe Amelia zu ihren Eltern."
stringn 9 "Finde Herostrates den Jüngeren und stecke ihn in das Verlies."
stringn 10 "Zahle dem Händler 15 Schalen Honig zum Tribut."
stringn 11 "Gehe mit deinen Helden zu dem geheimen Eingang in den Bergen!"
stringn 12 "Gehe mit deinen Helden in den Sumpf zu den Sumpfweisen!"
stringn 14 "Gehe mit deinen Helden zurück zu dem Artemis-Tempel!"
stringn 15 "Gib den Soldaten des Generals nochmals 50 Met für ihre Unterstützung."
