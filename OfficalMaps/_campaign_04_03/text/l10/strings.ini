[text]
stringn 0 "@搜寻玛尼与诺伯特。"
stringn 1 "@建起你的村庄！"
stringn 2 "走访此地所有的林哨："
stringn 3 "寻访林庙守卫的哨所。"
stringn 4 "与希拉、比雅尼一同进入那幽暗窟穴。"
stringn 5 "可选：烤制蛋糕奉予巨龙，使它们在任务中随同你的维京人。"
stringn 6 "与希拉、比雅尼带着一头火龙，再入那幽暗窟穴。"
stringn 7 "寻访草药师的哨所。"
stringn 8 "向草药师哨所缴纳 5 把铁制工具作为贡品。"
stringn 9 "寻访商人的哨所。"
stringn 10 "与那商人交易 20 件货品。"
stringn 11 "在棕榈林间寻访学童的哨所。"
stringn 12 "寻访水龙们的林村学堂。"
stringn 13 "护送孩子们前往林村学堂，去上水龙们的课！"
stringn 14 "向纳帕利亚人缴纳 25 桶蜂蜜酒作为贡品，使它们重归中立。"
stringn 15 "向林庙守卫缴纳 10 份蘑菇与 10 份草药作为贡品。"
stringn 16 "使传送装置恢复运作，与比雅尼、希拉同入水庙。"
stringn 21 "蛋糕 %d/15"
stringn 33 "为火龙的协助缴纳 20 份蛋糕作为贡品！"
stringn 34 "向林庙守卫缴纳 10 份蘑菇与 10 份草药作为贡品。"
stringn 35 "把 5 把铁制工具交给草药师们。"
stringn 36 "向纳帕利亚人缴纳 25 份大型治疗药水作为贡品。"
