stringn 1 "寻找你北面失联的驻军。"
stringn 2 "组建 30 名士兵。"
stringn 3 "消灭撒拉逊人，或与其指挥官会面。"
stringn 5 "当心那位背信的将军！"
stringn 6 "击溃将军的部队。"
stringn 21 "缴纳贡金，以重新安抚撒拉逊人。"
stringn 51 "撒拉逊人"
stringn 52 "哈德拉迪"
stringn 98 "身为瓦良格卫队的队长，维京人受命前往拜占庭的东部边境。数周以来，哈德拉迪将军的驻军音讯全无……"
stringn 99 "瓦良格卫队"
stringn 100 "比雅尼"
stringn 101 "西格德"