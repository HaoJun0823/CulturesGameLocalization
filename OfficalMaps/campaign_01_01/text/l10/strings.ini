[text]
stringn 0 "抵达村庄。"
stringn 1 "与德鲁伊交谈。"
stringn 2 "前往造船匠处。"
stringn 3 "交纳造船匠索要的贡品。"
stringn 4 "寻找诺恩三女神。"
stringn 5 "交纳10份蜂蜜酒作为造船贡品。"
stringn 13 "将若干平民转为建筑工人。"
stringn 14 "建造一座农场。"
stringn 15 "将一名维京人转为农民，看着他在劳作中积累经验。"
stringn 17 "建造一座磨坊。"
stringn 18 "将农民转为磨坊主，看着他在新行当中积累经验。"
stringn 20 "建造一口水井。"
stringn 21 "建造一座烘焙坊。"
stringn 22 "将磨坊主转为面包师，农民转为磨坊主，另择一名维京人当农民。"
stringn 23 "建造一个蜂巢。"
stringn 24 "建造一座酿酒坊。"
stringn 25 "等面包师经验足够后，将他转为酿酒师。"
stringn 50 "造船匠"
stringn 51 "诺恩三女神"
stringn 52 "德鲁伊"
stringn 98 "格陵兰海岸边，那座昏昏欲睡的小村庄里，日子过得平静而安详……直到那个刻骨铭心的日子来临……"
stringn 99 "格陵兰"
stringn 100 "比雅尼"