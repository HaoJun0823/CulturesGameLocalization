stringn 0 "Kiste"
string "Kisten k鰊nen manchmal in St鋎ten oder auf der Karte gefunden werden. Sie beinhalten meist seltene und n黷zliche Dinge, wie Tr鋘ke und Amulette.{newline}{newline}Einfache Kisten k鰊nen von jedem Wikinger - ob Mann oder Frau - ge鰂fnet werden."
string "Magische Kiste"
string "Diese besonderen Kisten k鰊nen manchmal in St鋎ten oder auf der Karte gefunden werden. In ihr liegen meist seltene und sehr n黷zliche Dinge verborgen, wie geheimnisvolle Tr鋘ke und magische Amulette. {newline}{newline}Magische Kisten k鰊nen nur von einem Druiden ge鰂fnet werden."
string "Schafe"
string "Die zottigen Tiere liefern den Wikingern vor allem Wolle, aber auch Nahrung.{newline}{newline}Schafe m黶sen erst domestiziert werden. Daf黵 muss ein Kundschafter sie finden und zur Viehz點hterei schicken, indem er nah an ihnen vorbei l鋟ft. Hat er ein Schaf eingefangen, bekommt es eine Markierung in Ihrer Spielerfarbe."
string "Rinder"
string "Die braunen Rinder liefern den Wikingern Leder und auch Nahrung. {newline}{newline}Rinder m黶sen erst domestiziert werden. Daf黵 muss ein Kundschafter sie finden und zur Viehz點hterei schicken, indem er nah an ihnen vorbei l鋟ft. Hat er ein Rind eingefangen, bekommt es eine Markierung in Ihrer Spielerfarbe."
string "Katapult"
string "Baukosten: 10 Holz{newline}{newline}Ein Katapult funktioniert nur, wenn einer Ihrer Soldaten hinter den Hebeln sitzt, also diesem Fahrzeug zugewiesen ist. Es bewegt sich zwar recht schwerf鋖lig fort und hat keinen guten Schutz, aber es ist wesentlich effektiver gegen Geb鋟de als Soldaten.{newline}{newline}Achtung! Aufgrund ihrer Gr鲞e und ihres Gewichts ist es Katapulten unm鰃lich, Br點ken zu 黚erqueren! Sie m黶sen also nach einer flachen Furt Ausschau halten, wenn Sie das Katapult 黚er einen Fluss f黨ren wollen."
string "Handkarren"
string "Baukosten: 2 Holz{newline}{newline}Mit Handkarren k鰊nen H鋘dler bis zu 10 Waren gleichzeitig zwischen zwei Geb鋟den transportieren. Um ihn zu benutzen, m黶sen Sie den H鋘dler einem Handkarren zuweisen. Sie benutzen ihn dann automatisch als Transportfahrzeug. {newline}{newline}Ein Tr鋑er hingegen kann einen Handkarren dazu benutzen, um Waren in der Landschaft einzusammeln. Dazu m黶sen Sie beim Handkarren die jeweils gew黱schte Warenmenge einstellen. Der Tr鋑er wird den Karren dann mit diesen Waren beladen. Schicken Sie nun den Handkarren an seinen Zielort und entladen k鰊nen Sie ihn mit dem 'Entladen'-Button."
string "Ochsenkarren"
string "Baukosten: 5 Holz. Als Zugtier wird ein Ochse ben鰐igt.{newline}{newline}Mit Ochsenkarren k鰊nen H鋘dler bis zu 20 Waren gleichzeitig zwischen zwei Geb鋟den transportieren. Um ihn zu benutzen, m黶sen Sie den H鋘dler einem Ochsenkarren zuweisen. Sie benutzen ihn dann automatisch als Transportfahrzeug. {newline}{newline}Ein Tr鋑er hingegen kann einen Ochsenkarren dazu benutzen, um Waren in der Landschaft einzusammeln. Dazu m黶sen Sie beim Handkarren die jeweils gew黱schte Warenmenge einstellen. Der Tr鋑er wird den Karren dann mit diesen Waren beladen. Schicken Sie nun den Ochsenkarren an seinen Zielort und entladen k鰊nen Sie ihn mit dem 'Entladen'-Button."
string "Schiff"
string "Baukosten: 10 Holz, 5 Leder{newline}{newline}Um in See zu stechen, braucht das Schiff einen Kommandanten. Weisen Sie einen Ihrer Wikinger dem Schiff zu ('Fahrzeug zuweisen'), um ihn zum Kommandanten zu machen. Sie k鰊nen so auch weitere Wikinger als Passagiere an Bord schicken.{newline}{newline}Um das Schiff mit Waren zu beladen, m黶sen Sie ihm mindestens einen Tr鋑er zuweisen. Er alleine kann das Schiff be- und entladen. Die gew黱schten Warenmengen stellt man im Schiffsfenster mit den Plus- und Minus-Buttons neben den Warensymbolen ein. Der Tr鋑er wird nun soviel ein- oder ausladen, bis die Menge erreicht ist. {newline}{newline}Um in See zu stechen, schicken Sie das Schiff mit der rechten Maustaste zum gew黱schten Zielort auf See. Das Schiff f鋒rt los, sobald alle Passagiere an Bord sind. {newline}{newline}Um wieder anzulegen, m黶sen Sie dem Schiff den Befehl zum 'ANDOCKEN' geben. {newline}{newline}Hat das Schiff angelegt, kann es von den Tr鋑ern entladen werden. Mit dem Befehl 'L諷CHEN' werden alle Waren von Bord gebracht. Mit dem Befehl 'Entladen' werden sowohl Waren als auch Leute von Bord geworfen. Sollen nur einige Waren entladen werden, reduzieren Sie im Schiffsfenster deren Wert mit dem Minus-Button neben der entsprechenden Ware."
string "Palisaden"
string "Baukosten: 1 Holz{newline}{newline}Die mannshohen Z鋟ne sind nicht nur gut gegen Angreifer, auch sind sie ein wirksamer Schutz gegen wilde Tiere."
string "Tore"
string "Baukosten: -{newline}{newline}Tore erm鰃lichen Ihren Wikingern das problemlose Verlassen eines mit Palisaden befestigten Dorfes. Sie k鰊nen nur an Stellen gesetzt werden, wo vorher ein Palisadenwall errichtet wurde und wo dieser geradlinig verl鋟ft."