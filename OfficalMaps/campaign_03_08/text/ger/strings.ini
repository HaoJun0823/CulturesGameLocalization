stringn 99 "DAS ACHTE WELTWUNDER"
stringn 98 "Wir landeten auf jener Insel, in deren Mitte ein mächtiger Obelisk - das achte Weltwunder - thronte. Nach den Vorhersagungen sollte er die Energien der anderen Wunder in sich bündeln und so die dunklen Mächte bannen... "