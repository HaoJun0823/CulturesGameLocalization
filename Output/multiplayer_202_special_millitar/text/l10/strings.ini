stringn 0 "龙之地 I"
stringn 1 "5 名玩家：巨龙定期出巢，给民众带来灾祸！密林中的恶狼阻断了所有退路……"
stringn 2 "你来到此地，是为了将巨龙重新封印回巢穴！"
stringn 3 "训练足够士兵，在狼林中寻找隐藏的开关并启动它们。开关会不定期出现在各位置，每启动一处便封闭一座龙巢之门。"
stringn 5 "抵御巨龙的进攻——它们会频繁来袭。"
stringn 6 "四座龙巢尽数封闭，则全员任务达成。"
