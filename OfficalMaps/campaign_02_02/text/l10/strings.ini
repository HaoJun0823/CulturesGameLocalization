stringn 0 "沿山谷前行，在那儿建起你自己的村庄。"
stringn 1 "向村庄缴纳 15 单位水与 10 份糕点作贡金。"
stringn 2 "若想让撒拉逊人保持中立，须缴 20 单位食物作贡金。（须先拜访撒拉逊人，他们才会向你提出贡金要求！）"
stringn 3 "若要与撒拉逊人贸易，须缴 10 单位蜂蜜酒作贡金。"
stringn 4 "跟随伊科尔前往舒姆萨利那神秘的地下墓穴。"
stringn 5 "找到撒拉逊难民的村庄！"
stringn 6 "@助村庄渡过饥荒，随后寻得舒姆萨利神秘墓穴的入口。"
stringn 7 "拜访东北面的撒拉逊人，或许他们愿意接受贡金？但务必小心！"
stringn 8 "寻找山区以北那神秘墓穴的入口。"
