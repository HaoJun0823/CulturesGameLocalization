stringn 0 "@HILF BEI DER ERRICHTUNG DER HÄNGENDEN GÄRTEN VON SEMIRAMIS!"
stringn 1 "Suche den Platz zur Errichtung der Gärten!"
stringn 2 "Baue eine kleine Siedlung auf."
stringn 3 "Liefere 80 Holz, 40 Steine, 40 Lehm und 40 Ziegel zu den Gärten für die künstlichen Bergterrassen!"
stringn 4 "Errichte 9 Brunnen in der Nähe der Gärten, um Wasser zu fördern."
stringn 5 "Suche 25 Rinder!"
stringn 6 "Befreie die Frauen der Hirten, um ihre Rinder und das Stück der Bauzeichnung zu erhalten."
stringn 7 "Zahle den Räubern 50 Münzen oder bekämpfe sie."
stringn 8 "Durchsuche das Räuberlager."
stringn 9 "Bringe die Frauen zurück in ihr Dorf."
stringn 10 "Finde die Bauzeichnungen."
stringn 11 "Zahle den Babyloniern für tapfere Soldaten 5 Eisen Tribut."
stringn 12 "Bringe den Kobulianern 10 Schuhe als Tribut."
stringn 13 "Gehe zu den unterirdischen Hallen!"
stringn 14 "Gehe mit deine Helden zurück zu den Gärten!"
