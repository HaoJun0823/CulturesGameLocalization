[control]
stringidmultiplier 1
[text]
stringn 0 "箱子"
string "箱子有时可以在城市或地图上找到。它们通常包含稀有和有用的物品，如药水和护符。{newline}{newline}普通箱子可以由任何维京人打开，无论男女。"
string "魔法箱子"
string "这些特殊箱子有时可以在城市或地图上找到。它们通常隐藏着稀有和非常有用的物品，如神秘药水和魔法护符。{newline}{newline}魔法箱子只能由德鲁伊打开。"
string "绵羊"
string "这些毛茸茸的动物主要为维京人提供羊毛，也提供食物。{newline}{newline}绵羊必须先被驯化。侦察兵必须找到它们并将它们带到畜牧场，方法是从它们附近走过。当他捕获一只绵羊时，它会获得你的玩家颜色标记。"
string "牛"
string "棕色的牛为维京人提供皮革和食物。{newline}{newline}牛必须先被驯化。侦察兵必须找到它们并将它们带到畜牧场，方法是从它们附近走过。当他捕获一头牛时，它会获得你的玩家颜色标记。"
string "投石机"
string "建造成本：10木材{newline}{newline}投石机只有在你的一名士兵坐在操纵杆后面，即分配给该车辆时才能工作。它移动相当笨拙，防护也不好，但对建筑的效果远胜于士兵。{newline}{newline}注意！由于其体积和重量，投石机无法穿过桥梁！因此，如果你想让投石机过河，必须寻找浅滩。"
string "手推车"
string "建造成本：2木材{newline}{newline}商人可以使用手推车在两个建筑之间同时运输多达10件物品。要使用它，你必须将商人分配给手推车。他们会自动将其用作运输工具。{newline}{newline}搬运工可以使用手推车在野外收集物品。为此，你必须在手推车中设置所需的物品数量。搬运工会将手推车装满这些物品。现在将手推车送到目的地，然后可以用'卸载'按钮卸载。"
string "牛车"
string "建造成本：5木材。需要一头牛作为牵引动物。{newline}{newline}商人可以使用牛车在两个建筑之间同时运输多达20件物品。要使用它，你必须将商人分配给牛车。他们会自动将其用作运输工具。{newline}{newline}搬运工可以使用牛车在野外收集物品。为此，你必须在手推车中设置所需的物品数量。搬运工会将车装满这些物品。现在将牛车送到目的地，然后可以用'卸载'按钮卸载。"
string "船只"
string "建造成本：10木材，5皮革{newline}{newline}要出海，船只需要一名指挥官。将你的一名维京人分配给船只（'分配车辆'），使其成为指挥官。你还可以将更多维京人作为乘客送上船。{newline}{newline}要装载货物，你必须至少分配一名搬运工给船只。他可以独自装卸船只。所需的物品数量在船只窗口中通过物品符号旁边的加号和减号按钮设置。搬运工会装载或卸载，直到达到所需数量。{newline}{newline}要出海，右键点击船只将其送到海上的目标位置。所有乘客上船后，船只即启航。{newline}{newline}要靠岸，你必须给船只下达'靠岸'命令。{newline}{newline}船只靠岸后，可以由搬运工卸载。使用'删除'命令将所有货物卸下。使用'卸载'命令将货物和人员都卸下。如果只想卸下部分货物，请在船只窗口中使用相应物品旁边的减号按钮减少其数量。"
string "栅栏"
string "建造成本：1木材{newline}{newline}与人等高的围栏不仅能很好地防御攻击者，也是抵御野生动物的有效屏障。"
string "门"
string "建造成本：-{newline}{newline}门允许你的维京人顺利离开用栅栏围起来的村庄。它们只能放置在已有栅栏墙且呈直线的位置。"
