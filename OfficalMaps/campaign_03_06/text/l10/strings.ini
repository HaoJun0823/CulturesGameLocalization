stringn 98 "每隔四载之夏，奥林匹亚便有一场盛大庆典。只要节庆持续，克洛诺斯丘周遭的圣林之地便得安宁……可我们真能重建菲迪亚斯的那尊巨像吗？诸城之间，猜忌实在太深。"
stringn 99 "奥林匹亚的菲迪亚斯宙斯像"