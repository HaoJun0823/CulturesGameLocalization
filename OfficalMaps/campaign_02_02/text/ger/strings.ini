[text]
stringn 0 "Ziehe entlang des Tales und baue dort ein eigenes Dorf auf."
stringn 1 "Reiche dem Dorf 15 Wasser und 10 Kuchen zum Tribut."
stringn 2 "Zahle 20 Nahrung Tribut, wenn du die Sarazenen neutral stimmen willst. (Du musst den Sarazenen erst einen Besuch abstatten, damit sie dir den Tribut anbieten!)"
stringn 3 "Zahle 10 Met Tribut, wenn du mit den Sarazenen Handel treiben willst."
stringn 4 "Folge Ykol zu den geheimnisvollen Katakomben von Schumsali."
stringn 5 "Finde das Dorf der Sarazenenflüchtlinge!"
stringn 6 "@Hilf dem Dorf in seiner Hungersnot und finde dann den Eingang zu den geheimnisvollen Katakomben von Schumsali."
stringn 7 "Besuche die Sarazenen im Nordosten, vielleicht lassen sie sich auf einen Tribut ein? Aber sei vorsichtig!"
stringn 8 "Suche den Eingang zu den geheimnisvollen Katakomben nördlich des Gebirges."
stringn 32 "Zahle 20 Nahrung Tribut, wenn du die Sarazenen neutral stimmen willst."
stringn 33 "Zahle 10 Met Tribut, wenn du mit den Sarazenen Handel treiben willst."
stringn 34 "Reiche Hatschis Nachbarn 15 Wasser und 10 Kuchen zum Tribut."
