# =============================================================================
# Cultures Saga — Build & Release Workflow
# =============================================================================
# Triggers:
#   - workflow_dispatch (manual)  ->  build + publish a release
#   - push to main                ->  build only, no release (verify integrity)
#
# Game data (SAGA_GAME_HACK/Data/maps/) is NOT in the git repo.
# The workflow will attempt to restore it from a previous release asset
# named "game-data".  Upload it once via:
#   gh release upload <tag> game-data.tar.gz --clobber
#
# If game data is unavailable, map building is SKIPPED; only Data/Text
# and supplementary assets are published.  This is normal for a first run.
# =============================================================================

name: Build & Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag (e.g. v20260813-utf8)
        required: false
        type: string
      game_data_url:
        description: Direct URL to game-data.tar.gz (overrides release asset)
        required: false
        type: string

  push:
    branches: [main]

permissions:
  contents: write
  actions: read

env:
  PYTHON_VERSION: '3.11'
  GAME_DIR: ${{ github.workspace }}/.game-data/SAGA_GAME_HACK

jobs:
  build:
    name: Build & Release
    runs-on: windows-latest

    steps:
      # ---- Checkout --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---- Python ----------------------------------------------------------
      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # ---- Restore game data -----------------------------------------------
      - name: Restore game data
        shell: pwsh
        run: |
          $gameDataDir = "${{ env.GAME_DIR }}"
          New-Item -ItemType Directory -Force -Path $gameDataDir | Out-Null

          $url = "${{ inputs.game_data_url }}"
          if (-not $url) {
            try {
              $release = gh release view --json assets 2>$null
              if ($release) {
                $asset = $release.assets | Where-Object { $_.name -eq "game-data" } `
                  | Select-Object -First 1
                if ($asset) {
                  $url = $asset.url
                  Write-Host "Found game-data asset: $($asset.name)"
                }
              }
            } catch {
              Write-Host "No game-data release asset found"
            }
          }

          if ($url) {
            Write-Host "Downloading game data from: $url"
            $archive = "$env:RUNNER_TEMP/game-data.tar.gz"
            if ($url -match "api.github.com") {
              Invoke-WebRequest -Uri $url -Headers @{Accept = "application/octet-stream"} -OutFile $archive
            } else {
              Invoke-WebRequest -Uri $url -OutFile $archive
            }
            tar -xzf $archive -C $gameDataDir
            Write-Host "Game data restored to $gameDataDir"
          } else {
            Write-Host "::warning::No game data source - map building will be skipped"
            New-Item -ItemType Directory -Force -Path "$gameDataDir/Data/maps" | Out-Null
            New-Item -ItemType Directory -Force -Path "$gameDataDir/DataX/UserCampaigns" | Out-Null
          }

      # ---- Build -----------------------------------------------------------
      - name: Build all languages
        shell: pwsh
        run: |
          python build_text.py --clean 2>&1

      # ---- Package ---------------------------------------------------------
      - name: Create release archive
        shell: pwsh
        run: |
          $date = Get-Date -Format "yyyyMMdd"
          $zipName = "CulturesGameLocalization_${date}_utf8.zip"
          $zipPath = "$env:RUNNER_TEMP/$zipName"

          Compress-Archive -Path "${{ github.workspace }}/_build/*" -DestinationPath $zipPath

          "ZIP_NAME=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ZIP_PATH=$zipPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $size = (Get-Item $zipPath).Length / 1MB
          Write-Host "Created: $zipName ($([math]::Round($size, 1)) MB)"

      # ---- Release (manual trigger only) -----------------------------------
      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ inputs.release_tag }}"
          if (-not $tag) {
            $date = Get-Date -Format "yyyyMMdd"
            $tag = "v${date}-utf8"
          }
          $zipName = "$env:ZIP_NAME"
          $zipPath = "$env:ZIP_PATH"

          $lines = @(
            "## Cultures Saga - Multi-language Build",
            "",
            "Date: $(Get-Date -Format "yyyy-MM-dd HH:mm")",
            "Languages: CHN (l10), ger, eng, pol",
            "Format: UTF-8",
            "",
            "### Contents",
            "- Data/maps/ - Main campaign maps with localized text",
            "- DataX/UserCampaigns/ - User campaign maps",
            "- Data/Text/ - Game system text (hypertext, encyclopedia)",
            "- DataX/FMV/ - Full-motion videos (when available)",
            "",
            "### Notes",
            "- Map.dat files are original game data, not modified by this build",
            "- Only text content (strings.ini, briefings.txt, .hlt files) is localized",
            "- If maps are missing, the build lacked source game data",
            "  Run locally with SAGA_GAME_HACK to produce a full build"
          )
          $body = $lines -join "`r`n"

          $existing = gh release view $tag --json name 2>$null
          if ($existing) {
            Write-Host "Release $tag already exists, uploading asset to it"
            gh release upload $tag "$zipPath#$zipName" --clobber
          } else {
            Write-Host "Creating release $tag"
            gh release create $tag "$zipPath#$zipName" --title "$tag" --notes "$body"
          }

      # ---- Upload artifact (always) ----------------------------------------
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_PATH }}
          retention-days: 30