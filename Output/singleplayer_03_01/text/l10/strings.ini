stringn 0 "去找你部族的德鲁伊！"
stringn 1 "开采黄金并铸成硬币，好让德鲁伊能酿造药剂！"
stringn 2 "寻找早先在此取水的驼夫部族！"
stringn 3 "查明运水商队究竟遭遇了什么！"
stringn 4 "与绿洲农人的首领交谈！"
stringn 5 "向绿洲农人部族运送 50 单位水，并护佑你的商人免受沙漠盗匪劫掠！"
stringn 6 "前往城中的神庙！"
stringn 7 "建造一艘船，并为它装填饮水！"
stringn 8 "与比雅尼及部众乘船寻访神谕！"
stringn 9 "卸下船货，与神谕守卫会面！"
stringn 10 "解放运输骆驼，征服沙漠盗匪部族！否则另寻他途。"
stringn 11 "@解放水之神谕！"
