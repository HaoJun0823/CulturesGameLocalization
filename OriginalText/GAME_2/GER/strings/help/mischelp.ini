[text]
stringn 0 "Kiste"
string "Kisten können manchmal in Städten oder auf der Karte gefunden werden. Sie beinhalten meist seltene und nützliche Dinge, wie Tränke und Amulette.{newline}{newline}Einfache Kisten können von jedem Wikinger - ob Mann oder Frau - geöffnet werden."
string "Magische Kiste"
string "Diese besonderen Kisten können manchmal in Städten oder auf der Karte gefunden werden. In ihr liegen meist seltene und sehr nützliche Dinge verborgen, wie geheimnisvolle Tränke und magische Amulette. {newline}{newline}Magische Kisten können nur von einem Druiden geöffnet werden."
string "Schafe"
string "Die zottigen Tiere liefern den Wikingern vor allem Wolle, aber auch Nahrung.{newline}{newline}Schafe müssen erst domestiziert werden. Dafür muss ein Kundschafter sie finden und zur Viehzüchterei schicken, indem er nah an ihnen vorbei läuft. Hat er ein Schaf eingefangen, bekommt es eine Markierung in Ihrer Spielerfarbe."
string "Rinder"
string "Die braunen Rinder liefern den Wikingern Leder und auch Nahrung. {newline}{newline}Rinder müssen erst domestiziert werden. Dafür muss ein Kundschafter sie finden und zur Viehzüchterei schicken, indem er nah an ihnen vorbei läuft. Hat er ein Rind eingefangen, bekommt es eine Markierung in Ihrer Spielerfarbe."
string "Katapult"
string "Baukosten: 10 Holz{newline}{newline}Ein Katapult funktioniert nur, wenn einer Ihrer Soldaten hinter den Hebeln sitzt, also diesem Fahrzeug zugewiesen ist. Es bewegt sich zwar recht schwerfällig fort und hat keinen guten Schutz, aber es ist wesentlich effektiver gegen Gebäude als Soldaten.{newline}{newline}Achtung! Aufgrund ihrer Größe und ihres Gewichts ist es Katapulten unmöglich, Brücken zu überqueren! Sie müssen also nach einer flachen Furt Ausschau halten, wenn Sie das Katapult über einen Fluss führen wollen."
string "Handkarren"
string "Baukosten: 2 Holz{newline}{newline}Mit Handkarren können Händler bis zu 10 Waren gleichzeitig zwischen zwei Gebäuden transportieren. Um ihn zu benutzen, müssen Sie den Händler einem Handkarren zuweisen. Sie benutzen ihn dann automatisch als Transportfahrzeug. {newline}{newline}Ein Träger hingegen kann einen Handkarren dazu benutzen, um Waren in der Landschaft einzusammeln. Dazu müssen Sie beim Handkarren die jeweils gewünschte Warenmenge einstellen. Der Träger wird den Karren dann mit diesen Waren beladen. Schicken Sie nun den Handkarren an seinen Zielort und entladen können Sie ihn mit dem 'Entladen'-Button."
string "Ochsenkarren"
string "Baukosten: 5 Holz. Als Zugtier wird ein Ochse benötigt.{newline}{newline}Mit Ochsenkarren können Händler bis zu 20 Waren gleichzeitig zwischen zwei Gebäuden transportieren. Um ihn zu benutzen, müssen Sie den Händler einem Ochsenkarren zuweisen. Sie benutzen ihn dann automatisch als Transportfahrzeug. {newline}{newline}Ein Träger hingegen kann einen Ochsenkarren dazu benutzen, um Waren in der Landschaft einzusammeln. Dazu müssen Sie beim Handkarren die jeweils gewünschte Warenmenge einstellen. Der Träger wird den Karren dann mit diesen Waren beladen. Schicken Sie nun den Ochsenkarren an seinen Zielort und entladen können Sie ihn mit dem 'Entladen'-Button."
string "Schiff"
string "Baukosten: 10 Holz, 5 Leder{newline}{newline}Um in See zu stechen, braucht das Schiff einen Kommandanten. Weisen Sie einen Ihrer Wikinger dem Schiff zu ('Fahrzeug zuweisen'), um ihn zum Kommandanten zu machen. Sie können so auch weitere Wikinger als Passagiere an Bord schicken.{newline}{newline}Um das Schiff mit Waren zu beladen, müssen Sie ihm mindestens einen Träger zuweisen. Er alleine kann das Schiff be- und entladen. Die gewünschten Warenmengen stellt man im Schiffsfenster mit den Plus- und Minus-Buttons neben den Warensymbolen ein. Der Träger wird nun soviel ein- oder ausladen, bis die Menge erreicht ist. {newline}{newline}Um in See zu stechen, schicken Sie das Schiff mit der rechten Maustaste zum gewünschten Zielort auf See. Das Schiff fährt los, sobald alle Passagiere an Bord sind. {newline}{newline}Um wieder anzulegen, müssen Sie dem Schiff den Befehl zum 'ANDOCKEN' geben. {newline}{newline}Hat das Schiff angelegt, kann es von den Trägern entladen werden. Mit dem Befehl 'LÖSCHEN' werden al"
string "Palisaden"
string "Baukosten: 1 Holz{newline}{newline}Die mannshohen Zäune sind nicht nur gut gegen Angreifer, auch sind sie ein wirksamer Schutz gegen wilde Tiere."
string "Tore"
string "Baukosten: -{newline}{newline}Tore ermöglichen Ihren Wikingern das problemlose Verlassen eines mit Palisaden befestigten Dorfes. Sie können nur an Stellen gesetzt werden, wo vorher ein Palisadenwall errichtet wurde und wo dieser geradlinig verläuft."