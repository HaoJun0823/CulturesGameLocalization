[text]
stringn 1 "본거지는 모든 마을의 기지이며 물품 저장과 종교적 동기를 위한 목적을 합니다. 본거지는 지어지는 것이 아니라 놓여지는 특수한 건물입니다. 다른 건물과는 달리 본거지는 공격자를 상대로 방어할 수 있습니다."
stringn 2 "주택1에는 최대 한 가족(남자, 여자, 아이)이 살 수 있습니다. 여기 사는 남자의 침 곳으로 쓰입니다. 이 집에 여자가 살면 모든 주민에게 식량을 제공합니다. 여기 사는 결혼한 부부는 자녀를 둘 수 있습니다."
stringn 3 "주택2에는 최대 두 가족(각각 남자, 여자, 아이)이 살 수 있습니다. 이곳에 사는 남성의 수면터로 사용됩니다. 여성이 살면 이 집의 모든 주민에게 식량을 공급합니다. 결혼한 부부는 여기서 아이를 가질 수 있습니다."
stringn 4 "주택3에는 최대 세 가족(각 남자, 여자, 아이)이 살 수 있습니다. 이곳에 사는 남성을 위한 잠자리입니다. 여자가 이집에 살면 모든 입주자에게 식량을 제공합니다. 여기 사는 결혼 부부는 아이를 낳을 수 있습니다."
stringn 5 "주택4에는 최대 네 가족(각 남자, 여자, 아이)이 살 수 있습니다. 여기에 살 남성의 잠자리에 해당합니다. 이 집에 여자이 살면 모든 주민에게 식량을 공급합니다. 이곳에 사는 기혼 부부는 아이를 가질 수 있습니다."
stringn 6 "주택5에는 최대 다섯 가족(각 남자, 여자, 아이)이 살 수 있습니다. 이곳에서 사는 남자를 위한 수면처입니다. 여자가 이집에 살고 있으면 모든 주민에게 식량을 제공합니다. 이곳에 사는 결혼한 부부는 아이를 가질 수 있습니다."
stringn 7 "창고1은 가장 작은 창고이며 물품 보관을 담당합니다. 필요할 때 바이킹은 여기 창고에서 물품을 가져옵니다. 물품마다 최소 재고와 희망 재고를 설정할 수 있습니다. 운반인이나 상인이 창고에 배정되면 항상 희망 재고를 채우려고 합니다."
stringn 8 "창고2는 물품 보관을 담당합니다. 필요할 때 바이킹은 이 창고에서 물품을 가져옵니다. 물품마다 최소 재고와 희망 재고를 설정할 수 있습니다. 창고에 운반인이나 상인이 배정되면 항상 희망 재고를 채우려고 합니다."
stringn 9 "창고3은 물품 보관을 담당합니다. 필요할 때 바이킹은 이 창고에서 필요한 물을 가져갑니다. 각 품마다 최저 재고와 원하는 재고 수치를 설정할 수 있습니다. 창고에 운반인 혹은 상인을 배정하면 언제나 원하는 재고를 채우기 위해 노력합니다."
stringn 10 "우물은 자체적으로 물을 생산합니다. 배정된 운반인은 물을 제과점, 양조장, 연금술사의 오두막 같은 필요한 작업 장으로 가져다줍니다."
stringn 11 "벌집에서 부지런한 벌들이 벌를 생산합니다. 운반인은 꿀을 제과점이나 양조장으로 옮겨 케이크나 꿀술을 만들 수 있습니다."
stringn 12 "농장 가의 비옥한 땅에는 한 명 이상의 농부들이 밀을 재배할 수 있습니다. 이 곡물은 제분소에서 밀가루를 만드는 데 필요하며 일부 건물의 지붕 재료로도 쓰입니다. 건물을 올릴 부지는 척박해도 되지만, 곁의 농부들이 밭은 물 좋고 푸른 땅이 필요합니다."
stringn 13 "바람으로 돌아가는 이 제분소에서는 밀가 밀을 갈아냅니다. 완성된 밀가루는 자루에 담아 제분소 앞에 쌓고, 맛있는 빵을 만드는 기본 재료가 됩니다."
stringn 14 "제과점에서는 맛있는 빵을 굽습니다. 제빵사는 제분업자에서 받은 밀가루와 우물에서 길어온 물을 사용합니다."
stringn 15 "제과점2에서는 맛있는 케이크를 굽습니다. 바이킹이 필요한 기술과 원자재를 갖추게 되면 이 제과점을 지을 수 있습니다. 비용과 부지를 아끼기 위해 제과점1을 제과점2로 확장할 수 있습니다."
stringn 16 "양조장에서 양조사가 진한 꿀술을 만듭니다. 그에게는 꿀과 물이 필요합니다."
stringn 17 "목축업자는 목장에서 나와 농가 주변을 배회하는 동물을 쫓습니다. 중요: 번식용 기본 무리를 얻으려면 정찰병이 양이나 소를 발견해야 합니다. 양은 모와 고기를, 소는 가죽과 고기를 제공합니다."
stringn 18 "맨발의 바이킹은 누구든지 가죽 신발 하나 정도는 염원합니다. 신발은 잭이 만든 곳. 그 공방1에서 생산됩니다. 신발을 신으면 바이킹은 더 빨리 움직입니다."
stringn 19 "재봉공방2에서는 양모와 가죽으로 가죽 갑옷과 천 갑옷을 만들어 병사의 옷이자 보호구를 제공합니다."
stringn 20 "도예소1에서 점토로 벽돌을 빚어 구워냅니다. 벽돌은 많은 건물의 건축 재료로 쓰입니다."
stringn 21 "도예소2는 기와 제작을 담당합니다. 기와는 점토로 빚어 구워집니다. 여러 건물의 지붕용 건축 재료로 사용됩니다."
stringn 22 "도예소3에서는 점토로 손수 정성을 담아 식기를 만들어 굽습니다. 식기가 있으면 바이킹의 식사가 두 배로 맛있게 느께저 허기가 더 오래 채워집니다."
stringn 23 "목공소1에서는 도구목수가 목재로 목제 도구를 만들 수 있으며, 이 도구들은 사용하는 바이킹의 생산성을 높입니다. 이곳은 물가에 건설해야 합니다. 나중에(목공소4)에서 이곳에서도 배를 지을 수 있기 때문입니다."
stringn 24 "목공소2에서는 한 명 이상의 목수가 목재로 바이킹 주택용 가구를 만듭니다. 나중에(목공공방4) 배 만들 수도 있으므로 물가에 지어야 합니다."
stringn 25 "목공소3에서는 한 명 이상의 목수가 목재로 나무 창과 손수를 만듭니다. 나중에(목공공방4)에서도 배를 지을 수 있도록 물가에 세우는 것이 좋습니다."
stringn 26 "소수레와 상선은 이 목공소4에서 목재로 만듭니다. 배를 만들 수 있도록 물가에 세워야 합니다."
stringn 27 "무기공방1에서는 무기 장인이 목재로 짧은 활과 장궁을 만들 수 있습니다."
stringn 28 "무기공방2에서는 무기 장인이 목재로 투석기를 만들 수 있습니다."
stringn 29 "석공은 공석소1 주변의 부석을 찾아 다져서 석재 블록으로 만듭니다. 그래서 이 건물은 부석의 근처에 지어져야 합니다."
stringn 30 "한 명 이상의 석공이 주변에서 부석을 수집하여 석공소2에서 대리석으로 가공합니다. 따라서 이 건물은 부석 근처에 세워야 합니다."
stringn 31 "대장장이 곳에서는 대장장이 철제 도구를 만들어 사용하는 바이킹의 생산성을 높입니다. 그 밖에도 철의와 단검을 병사들을 위해 여기에서 만들어냅니다."
stringn 32 "대장간2에서는 무기 대장장이가 철로 검을 단조할 수 있습니다. 도가니의 불이 꺼지지 않게 충분한 목재가 필요합니다. 전투에서 병사를 지키는 철의 갑옷도 이곳에서 생산됩니다."
stringn 33 "주조공은 이곳에서 금으로 화폐를 주조할 수 있습니다. 주조 불을 유지하려면 충분한 목재가 필요합니다. 금전은 무역과 조공 지불에 널리 쓰이는 수단으로 여겨집니다."
stringn 34 "약초 채집이는 자기 오두막 주변을 돌아다니며 야생 식물을 찾습니다. 발견하지 못하면 특별한 약초를 직접 재배합니다. 이 약초들은 영양 물약, 치유 물약, 전투 물약의 기본 재료로 쓰입니다. 이 건물의 부지는 거칠어도 되지만, 옆의 약초 채집이의 정원은 비친하고 푸른 땅이어야 합니다."
stringn 35 "작은 연금술사의 오두막에서 드루이드가 버섯으로 특별한 기름을 양조합니다. 이 기름은 본거지와 바이킹의 주택 앞에 피는 성화의 연료입니다. 채집꾼은 주변의 야생 버섯을 뒤져 드루이드에게 주어야 합니다. 그래야 드루이드가 일할 수 있습니다."
stringn 36 "큰 연금술사의 오두막은 바이킹에게 영양, 치유, 전투 포션을 갖추는 데 필요합니다. 이 조액에는 버섯과 기름뿐 아니라 물, 약초, 금도 필요합니다."
stringn 37 "신전은 종교적 동기 부여에 목적을 합니다. 신전은 성화의 마법을 주변 건물에 전파하는 유일한 건물이며, 따라서 이런 동기를 필요로 하는 작업 장, 즉 무기장인과 대장간 옆에 지어야 합니다."
stringn 38 "학교에서는 시간이 오래 걸리는 현장 수업 없이, 선수 지식도 없이 바이킹이 새로운 직업을 배울 수 있습니다. 전제 조건은 그 직업을 이미 자신의 바이킹 중 하나가 수행할 수 있어야 한다는 것입니다."
stringn 39 "병영에서는 남성 바이킹을 다양한 신병으로 모집할 수 있습니다. 병영에 장비를 가져오려면 최소한 한 명의 운반인이 그곳에서 일해야 합니다."
stringn 40 "바이킹이 배치된 작은 방어탑은 접근하는 적을 자동으로 방어합니다. 사거리와 방어력을 늘리기 위해 최대 3명의 장궁과 3명의 활로 배치할 수 있습니다."
stringn 41 "바이킹이 배치된 대형 방어탑은 다가오는 적을 자동으로 방어합니다. 사거리와 방어력을 높이기 위해 최대 4명의 장궁수와 4명의 단궁수를 배치할 수 있습니다."