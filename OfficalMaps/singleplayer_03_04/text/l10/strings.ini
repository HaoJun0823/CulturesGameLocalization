stringn 1 "出海捕鱼以养活你的子民，并用蜜酒武装他们。"
stringn 2 "前往西南大陆上的两座雇佣兵营地。"
stringn 3 "向雇佣兵缴纳贡金，使他们加入你的麾下。此处你只应建造最重要的建筑。"
stringn 4 "若你不愿自行造船，也可向营地首领缴纳贡金订购船只。"
stringn 5 "尝试将你的家园岛屿从海盗手中解放。你应尽可能带上所有可用之兵。"
stringn 6 "找到数年前北上探险、去探索那片土地的远征队。"
stringn 7 "帮助北方所有的龙族重获自由。为此你必须解放四座营地。"
stringn 9 "@解放你部族所有被俘的妇女。"
stringn 10 "此刻你将在远征营地受到欢迎。"
stringn 11 "若你厌倦了征战，便接受海盗的提议--缴纳索要的赎金。"
stringn 12 "打开通往海盗王国的通道。"
stringn 13 "你必须将家园岛屿从海盗手中解放，否则在此地找不到任何盟友。"
