stringn 0 "探索这片土地，寻找那张神秘地图的线索。"
stringn 1 "消灭废墟之城西南面森林中的恶狼，随后返回国王处。"
stringn 2 "与废墟之城的仓库交易 10 单位油，随后返回国王处。"
stringn 3 "建造一艘船，找到维兰并用他所需的货物换取魔法剑，随后返回国王处。"
stringn 4 "向铁匠的仓库运送 10 单位蜂蜜酒。"
stringn 5 "再次向铁匠的仓库运送 10 单位蜂蜜酒。"
stringn 6 "在遥远的北方寻找老国王。"
stringn 10 "若想平安通过，须向罗宾汉缴纳 10 枚金币作贡金。可在周边城镇筹措。"
stringn 31 "缴纳 10 枚金币以签订贸易协定。"
stringn 32 "只需 10 单位蜂蜜为贡，我们便结为盟友。"
stringn 33 "招募：10 枚金币即可雇得老练佣兵。"
stringn 34 "过河需付 10 枚金币！"
