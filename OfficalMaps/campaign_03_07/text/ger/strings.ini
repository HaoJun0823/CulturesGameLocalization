[text]
stringn 0 "@HILF BEI DER FERTIGSTELLUNG UND DER VERTEIDIGUNG DER PYRAMIDEN VON GIZEH!"
stringn 1 "Baue eine kleine Siedlung auf."
stringn 2 "Gehe zum Bauplatz."
stringn 3 "Bringe 50 Steine, 40 Marmorsäulen und 70 Gold zu den Pyramiden."
stringn 4 "Baue möglichst mindestens ein Lagerhaus bei den Pyramiden."
stringn 5 "Stelle den Ägyptern mindestens 25 Soldaten zur Verfügung."
stringn 6 "Wehre die Angriffe des dunklen Heeres ab."
stringn 7 "Zahle den Händler 45 Schalen Honig als Tribut."
stringn 8 "Zahle den Byzantinern für Söldner den geforderten Tribut."
stringn 9 "Reiche den Beduinen Waffen zum Tribut und sie ziehen mit euch in den Kampf."
stringn 10 "Gehe mit deine Helden zurück zu den Pyramiden!"
stringn 11 "Gehe zu Miguel, dem Händler!"
stringn 12 "Zahle Miguel den Tribut, wenn du seine Hilfe brauchst!"
stringn 13 "Suche die anderen Beduinenstämme, wenn du diesem Volk helfen willst!"
stringn 14 "Zahle den Ägyptern für Pharaonenkrieger den geforderten Tribut."
stringn 15 "Reiche den Magiern 100 Kräuter für den magischen Schutzwall."
