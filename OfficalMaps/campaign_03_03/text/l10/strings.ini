stringn 96 "比罗克拉特斯"
stringn 98 "我们航行前往罗德岛，本欲在那里竖起一尊巨像。然而等待我们的，却是一番恶毒的意外……"
stringn 99 "罗德岛巨像"
stringn 100 "派遣一名侦察兵前往罗德。"
stringn 110 "找到线索，看看你能如何援助罗德人……"
stringn 111 "找到琳达的妹妹。"
stringn 112 "去见佩特罗斯。他会继续助你一臂之力。"
stringn 113 "备一辆手推车，装上 10 桶蜂蜜酒，带到佩特罗斯处。"
stringn 114 "若你愿意，可向奥克索斯缴贡买下这辆手推车。"
stringn 115 "向克罗伊斯缴纳 10 把长弓作为贡品，以使他对你友好。"
stringn 120 "向东南突围前往林多斯。到了那里，你便能求得援手。"
stringn 121 "去拜访林多斯的市长。"
stringn 122 "与"秘书"塞克拉塔里奥斯一同去见港务长。"
stringn 123 "向市长领取一份许可文书。"
stringn 124 "把市长给的许可文书送交比罗克拉特斯。"
stringn 125 "在东方海岛上找到神谕神庙。"
stringn 130 "去林多斯寻访卡瑞斯。"
stringn 131 "向卡瑞斯缴纳 25 块大理石（以贡品形式）。"
stringn 132 "向卡瑞斯缴纳 5 根金条、10 份黏土、10 块碎石（以贡品形式）。"
stringn 133 "再向卡瑞斯缴纳 5 根金条、10 份黏土、10 块碎石（以贡品形式）。"
stringn 134 "再向卡瑞斯缴纳 10 根金条与 10 根铁条（以贡品形式）。"
