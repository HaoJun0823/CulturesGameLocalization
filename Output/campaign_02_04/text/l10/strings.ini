[text]
stringn 0 "寻找修道院。"
stringn 1 "寻得三位逝去君王的佩剑。"
stringn 2 "与法兰克城以南的渡船夫交谈。"
stringn 3 "携你的 5 名英雄一同造访神谕者。"
stringn 4 "设法与全部英雄进入地下墓穴。为此须向法兰克暴君缴纳其所索贡金，或与之交战。"
stringn 5 "找到铁匠约翰内斯，以锻造锁链。"
stringn 6 "找到灰袍德鲁伊，请其为锁链祝圣。"
stringn 7 "烘焙糕点并作为贡金交给佣兵，使他们随同你的维京人执行任务。"
stringn 8 "向德鲁伊缴纳 10 单位蘑菇作贡金。"
stringn 9 "若要让铁匠约翰内斯锻造锁链，须缴 20 把短剑作贡金。"
stringn 10 "向车夫支付渡河费用。"
stringn 31 "向修士捐赠 10 单位草药，祈其修道院安泰。"
stringn 32 "为换取法兰克暴君的中立姿态，须向其缴纳 30 枚钱币作贡金。"
stringn 33 "用 5 份糕点从西格德的预备队中诱出 5 名佣兵！"
stringn 34 "向渡船夫缴纳 10 单位蜂蜜酒作贡金，以渡往岛屿。"
stringn 35 "若要让铁匠锻造锁链，须缴 20 把短剑作贡金。"
stringn 36 "若要让德鲁伊为锁链祝圣，须缴 10 单位蘑菇作贡金。"
