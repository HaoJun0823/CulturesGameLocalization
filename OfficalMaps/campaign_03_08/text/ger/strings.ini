stringn 0 "@SUCHE DIE ARTEFAKTE DER EINZELNEN WELTWUNDER!"
stringn 1 "Finde das Artefakt des Leuchtturmes von Alexandria."
stringn 2 "Finde das Artefakt der hängenden Gärten der Semiramis."
stringn 3 "Finde das Artefakt der Kolosses von Rhodos."
stringn 4 "Finde das Artefakt der Grabstätte des Mausolos."
stringn 5 "Finde das Artefakt des Tempels von Ephesos."
stringn 6 "Finde das Artefakt der Zeusstatue in Olympia."
stringn 7 "Finde das Artefakt der Pyramiden von Gizeh.                                                                         ."
stringn 8 "Gehe zum Obelisken und suche nach der Ursache für die ausbleibende Vertreibung der dunklen Mächte!                                                                         ."
stringn 9 "Bringe den Sarazenen 30 Marmor in die Stadt oder bekämpfe sie! Baue, wenn nötig, ein eigenes Lagerhaus."
stringn 10 "Vereine die geteilte Stadt! Suche die jeweiligen Bürgermeister auf und bringe sie zum Obelisken!"
stringn 11 "Reiche dem Moorvolk 25 Kräuter zum Tribut!"
stringn 12 "Fahre mit einem Bewohner des Inselvolkes im Nordwesten zu denen im weiten Südosten!"
stringn 13 "Gehe mit ALLEN deinen Helden zurück zum Obelisken!"
