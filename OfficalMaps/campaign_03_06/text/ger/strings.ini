stringn 99 "ZEUSTATUE DES PHIDIAS IN OLYMPIA"
stringn 98 "Jeden vierten Sommer fand in Olympia ein großes Fest statt. Solange das Fest andauerte, herrscht Frieden in der Umgebung des Kronos-Hügels im Heiligen Hain… doch wird es uns gelingen, die Statue des Phidias wieder zu errichten? Es herrschte soviel Misstrauen unter den Städten."