stringn 99 "3) NAHRUNGSVERSORGUNG"
stringn 98 "Dieses Tutorial behandelt die grundlegenden Spielprinzipien, wie das Abbauen von Rohstoffen, das Errichten von Gebäuden und die grundlegende Nahrungsversorgung."