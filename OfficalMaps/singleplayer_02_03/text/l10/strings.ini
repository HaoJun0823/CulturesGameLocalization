stringn 0 "建立你的村庄！"
stringn 1 "拜访撒拉逊人的贸易站！"
stringn 2 "在村庄的北面找到德鲁伊！"
stringn 3 "为德鲁伊提供护送！"
stringn 4 "缴纳贡品，以安抚黄金蛮人，换取和平！"
stringn 5 "缴清这笔贡品，否则你与黄金蛮人之间将无友谊可言！"
stringn 6 "寻找智者的花岗岩！"
stringn 7 "探查恐怖之雾的秘密！"
stringn 8 "建造一艘船，以便探索更广阔的区域！"
stringn 9 "寻找那团令商人们陷入恐慌的神秘迷雾！"
stringn 10 "搜寻线索与办法，好穿越这片迷雾！"
stringn 11 "带领比雅尼和至少八名部下抵达雾中之岛！"
stringn 12 "若想与知识守护者和平共处，就缴纳贡品！"
stringn 13 "若你愿意，可协助海卢兰人，并送三名女子与他完婚！"
stringn 30 "缴纳以证明你的诚意："
