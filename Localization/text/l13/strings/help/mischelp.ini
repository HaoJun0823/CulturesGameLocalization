[text]
stringn 0 "상자"
string "상자는 때로 도시 또는 지도에서 발견할 수 있습니다. 대부분 물약과 부적 같은 희귀하고 유용한 물건이 들어 있습니다.{newline}{newline}일반 상자는 남녀노소 불문하고 어떤 바이킹도 열 수 있습니다."
string "마법 상자"
string "이 특별한 상자는 때로 도시나 지도에서 발견할 수 있습니다. 그 안에는 신비한 물약과 마법의 부적 같은 희귀하고 유용한 것이 숨어 있습니다.{newline}{newline}마법의 상자는 드루이드만 열 수 있습니다."
string "양"
string "포복한 이 동물은 바이킹에게 주로 양모뿐 아니라 식량도 제공합니다.{newline}{newline}양은 먼저 가축화되어야 합니다. 정찰병이 양을 찾아 가까이 지나가 그들을 목장으로 보내야 합니다. 양을 붙잡으면 플레이어의 색으로 표시가 나타납니다."
string "소"
string "갈색 소는 바이킹에게 가죽과 식량을 줍니다.{newline}{newline}소는 먼저 가축화해야 합니다. 그러기 위해선 정찰병이 소를 발견해 그 주위를 걸어 목장으로 보내야 합니다. 소를 붙잡으면 플레이어 색깔로 표시됩니다."
string "투석기"
string "건설 비용: 목재 10{newline}{newline}투석기는 병사 중 하나가 지레 뒤에 앉아 있어야만, 즉 이 차량에 배정되어야만 작동합니다. 기동은 매우 무겁고 방어도 좋지 않지만, 병사보다는 건물에 훨씬 효과적입니다.{newline}{newline}주의! 크기와 무게 때문에 투석기는 다리를 건너는 것이 불가능합니다! 강을 건너려면 투석기가 지나갈 만한 여울을 찾아야 합니다."
string "손수레"
string "건설비용: 목재 2{newline}{newline}손수레를 사용하면 상인은 두 건물 사이에서 동시에 최대 10개의 물품을 운반할 수 있습니다. 상인을 손수레에 배정해야 합니다. 그러면 상인이 자동으로 손수레를 운반 수단으로 사용합니다.{newline}{newline}반면 운반인은 손수레를 이용해 야외의 물품을 수집할 수 있습니다. 이 경우 손수레에 원하는 물품 수량을 설정해야 합니다. 운반인이 그 물품으로 수레를 채웁니다. 이제 손수레를 목적지로 보내고, '내리기'버튼으로 내릴 수 있습니다."
string "소수레"
string "건설비용: 목재 5. 끌 동물로 황소가 필요합니다.{newline}{newline}소수레로 상인은 두 건물 사이에서 최대 20개의 물품을 한 번에 운반할 수 있습니다. 상인을 소수레에 배정하고 이용하세요. 상인은 자동으로 수레를 운반 수단으로 사용합니다.{newline}{newline}반대로 운반인은 소수레를 이용해 야외 물품을 수집할 수 있습니다. 이를 위해 손수레에 원하는 물품 수량을 설정해야 합니다. 운반인은 이 물량으로 수레를 채웁니다. 이제 소수레를 목적지로 보내고, '내리기' 버튼으로 내릴 수 있습니다."
string "배"
string "건설비용: 목재10, 가죽 5{newline}{newline}배가 출항하려면 함장이 필요합니다. 바이킹 중 한 명을 배에 배치하세요('차량 배정') 그러면 함장이 됩니다. 이렇게 하여 다른 바이킹들을 승객으로 선상에 보낼 수 있습니다.{newline}{newline}배에 물품을 싣기 위해 최소 한 명의 운반인을 배치합니다. 그만이 배를 싣고 내릴 수 있습니다. 원하는 물량은 배 창에서 물품 기호 옆의 +와 - 버튼으로 설정합니다. 운반인은 목표량에 도달할 때까지 싣거나 내립니다.{newline}{newline}출하하려면 마우스 오른쪽 버튼으로 배를 바다의 목적지로 보냅니다. 모든 승객이 타면 배가 출발합니다.{newline}{newline}다시 닿으려면 배에게 '정박' 명령을 내야 합니다.{newline}{newline}배가 정박하면 운반인들이 물품을 내릴 수 있습니다. '하역' 명령은 모든 물품을 내립니다. '내리기' 명령은 물품과 사람들을 모두 하선시킵니다. 일부만 내리려면 배 창에서 해당 물품의 '-' 버튼으로 수량을 줄입니다."
string "울타리"
string "건설비용: 목재 1{newline}{newline}사람만한 높이의 울타리는 공격을 막을 뿐 아니라 야생 동물에게 효과적인 방어막이 됩니다."
string "문"
string "건설비용:-{newline}{newline}문은 울타리로 요새화된 마을을 바이킹이 막힘없이 나갈 수 있게 합니다. 문은 울타리 벽이 세워졌고 직선으로 이어지는 곳에만 놓을 수 있습니다."