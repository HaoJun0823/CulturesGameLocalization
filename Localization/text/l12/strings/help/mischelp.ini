[text]
stringn 0 "箱"
string "宝箱は、時に都市や地図上で見ることができます。たいていはポーションやお守りのような珍しい有益な品が入っています。{newline}{newline}単純な宝箱は、男性女性を問わずヴァイキングであれば誰でも開けることができます。"
string "魔法の箱"
string "これらの特別な箱は都市やマップで見つかります。その中には神秘の薬や魔法のお守りといった希少で便利なものが隠されています。{newline}{newline}魔法の箱はドルイードだけが開けることができます。"
string "羊"
string "この毛むくらの動物は、ヴァイキングに主に羊毛を与えてくれますが、食料にもなります。{newline}{newline}羊はまず飼い慣らす必要があります。そのためには、羊を見つけた斥候が彼らの近くを歩いて牧場に連れて行きます。羊を捕まえたら、あなたのプレイヤーカラーでマークされます。"
string "牛"
string "褐色の牛はヴァイキングに革と食料を供給します。{newline}{newline}牛はまず家畜化する必要があります。そのために斥候は牛を発見し、そのそばを歩くことで牛を牧場へ送らなければなりません。斥候が牛を捕まえたら、あなたのプレイヤーカラーでマーキングされます。"
string "投石機"
string "建設費: 10木材{newline}{newline}投石機は、兵士の誰かが車のレバーの後ろに座っている場合に、すなわちこの乗り物に割り当てられている場合にだけ作動します。機動は非常に困難で防御に劣るものの、兵士より建物に対してははるかに効果的です。{newline}{newline}注意！その大きさと重さのために投石機は橋を渡ることができません！投石機で川を渡りたいなら、浅い浅瀬を探さなければなりません。"
string "手押し車"
string "建設費: 2木材{newline}{newline}手押し車があれば、商人は2つの建物の間で、最大10の商品を同時に運搬できます。使用するには、商人を手押し車に割り当てます。彼は自動的に輸送の車両としてそれを使います。{newline}{newline}一方、運搬人は手押し車を使って、土地の物を回収することができます。この場合、手押し車で必要な商品量を設定してください。運搬人は、その商品を手押し車に積み込みます。手押し車を目的地に送り、'アンロード'ボタンで積荷を下ろせます。"
string "牛車"
string "建設費: 5木材。牽引には牛が必要です。{newline}{newline}牛車があれば、商人は2つの建物の間で最大20個の商品を同時に運ぶことができます。牛車を使うには商人を牛車に割り当ててください。彼は自動的にそれを輸送車両として使用します。{newline}{newline}一方、運搬人は牛車を田野の収集に使うことができます。この目的のため、手で牛に望みの商品数量を設定してください。運搬人はこれらの商品を牛に積みます。牛車を目的地に送り、次に'アンロード'ボタンで積荷を下ろせます。"
string "船"
string "建費：木材10、革5{newline}{newline}出航には船長が必要です。ヴィルキングの一人を船に割り当ててください('乗り物を割り当て')船長になります。こうしてさらなるヴァイキングを旅客として船上に送れます。{newline}{newline}船に商品を積むには、少なくとも1人の運搬人を割り当ててください。彼だけが船の貨を上げ下げできます。希望の商品量は、船ウィンドウで商品アイコン脇のプラス・マイナスボタンで設定します。運搬人は、その量が達成されるまで積み込みまたは積み下ろしします。{newline}{newline}出航には、右マウスで船を海上の目標地点に送ってください。全乗客が乗ると、船は港を出ます。{newline}{newline}再度の接岸には、船に'DOCK'命令を与えてください。{newline}{newline}船が接岸すると、運搬人たちはそれを降ろすことができます。'荷降ろし'命令ですべての積み荷が下船します。'アンロード'命令は積み荷と人々の両方を船から降ろします。一部の商品だけ下ろしたい場合は、船ウィンドウの対応する品のマイナスボタンで値を減らしてください。"
string "柵"
string "建設費用：1木材{newline}{newline}人の背丈の柵は攻撃者を防ぐだけでなく、野生動物を封じ込めるのに有効です。"
string "門"
string "建設費用:-{newline}{newline}門は柵で堅固にされた村の離脱を、ヴァイキングが簡単にします。門は、あらかじめ柵の壁が設置され、それが一直線に続く場所にのみ置けます。"