stringn 0 "@在神庙前竖起宙斯巨像！"
stringn 1 "寻访并联合你的部族。"
stringn 2 "在商人的货栈屋之间，建起一座你自己的仓储屋！"
stringn 3 "前往工地。"
stringn 4 "将 80 金运抵巨像工地。"
stringn 5 "前往伊利斯。"
stringn 6 "寻得隐秘的象牙与那些珍稀的贵金属。"
stringn 7 "向科林斯人奉上一件他们信仰的圣物。"
stringn 8 "找到奥林匹亚的奔跑者，向他发起一场赛跑挑战。"
stringn 9 "促使诸族携手协作，与伊利斯人同赴斯巴达！"
stringn 10 "向商人缴纳 15 罐蜂蜜作为贡品，以换取更多货品。"
stringn 11 "向游牧民缴纳 15 把长剑作为贡品。"
stringn 12 "将 40 根大理石柱运抵巨像工地。"
stringn 13 "携你全部英雄与一名伊利斯士兵，前往兵营。"
stringn 14 "与你的英雄们返回巨像工地！"
stringn 15 "去探索斯巴达吧，你现已获准于此！"
stringn 16 "缴此贡品，你将得一辆手推车与一辆牛车："
stringn 17 "缴此贡品，你将得 15 个营养护符："
