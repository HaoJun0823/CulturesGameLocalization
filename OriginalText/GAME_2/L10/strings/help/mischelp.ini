[text]
stringn 0 "宝箱"
string "有时候会在城市里或地图上找到宝箱，宝箱中都是一些珍贵和有用的物品，如药水{newline}{newline}与护身符。{newline}{newline}一般而言，任何人都可以打开普通的宝箱。"
string "魔法箱"
string "有时候会在城市里或地图上找到魔法箱，得到一些相当珍贵有用的物品，如神奇药{newline}{newline}水与护身符。{newline}{newline}只有德鲁伊僧侣可以打开魔法箱。"
string "绵羊"
string "这种毛茸茸的动物是维京人羊毛与食物的来源。{newline}{newline}要饲养绵羊必须先指定探勘家走近羊群，驯服羊只后将羊只带至牧场。只要一将羊{newline}{newline}只驯服，便会将其标上你的代表色。"
string "牛"
string "牛是维京人食物与皮革的来源。{newline}{newline}要饲养乳牛必须先指定探勘家走近牛群，驯服牛只后将其带至牧场。只要一将牛只{newline}{newline}驯服，便会将其标上你的代表色。"
string "投石机"
string "建造费用:10单位木头。{newline}{newline}唯有被士兵操作的时候，才会有所作用，因此必须将士兵指定至该工具。投石机行动{newline}{newline}缓慢且欠缺防御功能，但面对建筑物时拥有着强大的破坏力。{newline}{newline}注意!由于投石机的重量与大小因素，使其无法通过桥梁。若想让投石机渡河，只能{newline}{newline}透过穿越平坦的浅滩才行。"
string "手推车"
string "建造费用:2单位木头。{newline}{newline}靠着手推车的帮忙，贸易商一次可运送10单位的商品来回于两建筑物间。要使用手推{newline}{newline}车，必须指定贸易商至该运输工具，之后就能够自动的进行运送工作。{newline}{newline}搬运工可以使用手推车在画面上收集物品，要达到此功能，必须指定手推车所需运{newline}{newline}送的物品数量，如此一来，搬运工会将这些物品装载上手推车，然后运往目的地后选择「{newline}{newline}卸载」，即可将物品卸下。"
string "牛车"
string "建造费用:5单位木头，需要一头牛去牵引牛车。{newline}{newline}靠着牛车的帮忙，贸易商可以一次运送20单位的商品来回于两建筑物间。要使用牛{newline}{newline}车，必须指定贸易商至该运输工具，之后就能够自动的进行运送工作。{newline}{newline}搬运工可以使用牛车在画面上收集物品，要达到此功能，必须指定牛车所需运送的{newline}{newline}物品数量，如此一来，搬运工会将这些物品装载上牛车，然后运往目的地后选择「卸载」，{newline}{newline}即可将物品卸下。"
string "船"
string "建造费用:10单位木头、5单位皮革。{newline}{newline}船只需要操作员才能出海，指定一位维京人到船上(「指定运输工具」)使其成为操作{newline}{newline}员，如此一来你才可以指定更多维京人登上该船。{newline}{newline}要将物品装载到船上，至少须指定一名以上的搬运工至该船，因为只有搬运工能从{newline}{newline}事船只的装载与卸载动作。你可以在船只视窗内透过物品图示旁的加与减按钮来决{newline}{newline}定物品的数量，接着，搬运工便会开始将物品装载上船或卸载下船，直到达到所要求{newline}{newline}的数量为止。{newline}{newline}要出海远行，只要用滑鼠右键点选目的地即可，当所有乘客都上船后，船只会自动航向{newline}{newline}目的地。要使船只靠岸，只要下达「停泊」指令即可。船只靠岸后，船上的搬运工会开始{newline}{newline}卸载物品，使用「卸载物品」指令可将船上所有物品卸载下船，「卸载」指令则是让船上{newline}{newline}乘客与物品一同登陆。"
string "栅栏"
string "建造费用:1单位木头。{newline}{newline}可以防御敌人攻击村庄，同时防止野兽的侵入。"
string "栅门"
string "建造费用:-{newline}{newline}当村庄完全被栅栏包围住后，村民们就只能透过栅门来进出村庄。{newline}{newline}栅门只能建造于呈直线排列的栅栏上。"