[text]
stringn 1 "母舰是每一座村庄的基础，提供储存食物的功能并提高人民的宗教信仰。{newline}{newline}母舰是无法被建造之特殊建筑物，会固定在地图上某处，可防御敌人攻击。"
stringn 2 "一级住宅可供一个家庭(父亲、母亲和小孩)居住，男性居民在住宅内可以安心睡眠，{newline}{newline}女性居民会为同一个住宅内的所有居民准备食物。夫妻可以在住宅内生儿育女。"
stringn 3 "二级住宅可供二个家庭(父亲、母亲和小孩)居住，男性居民在住宅内可以安心睡眠，{newline}{newline}女性居民会为同一个住宅内的所有居民准备食物。夫妻可以在住宅内生儿育女。"
stringn 4 "三级住宅可供三个家庭(父亲、母亲和小孩)居住，男性居民在住宅内可以安心睡眠，{newline}{newline}女性居民会为同一个住宅内的所有居民准备食物。夫妻可以在住宅内生儿育女。"
stringn 5 "四级住宅可供四个家庭(父亲、母亲和小孩)居住，男性居民在住宅内可以安心睡眠，{newline}{newline}女性居民会为同一个住宅内的所有居民准备食物。夫妻可以在住宅内生儿育女。"
stringn 6 "五级住宅可供五个家庭(父亲、母亲和小孩)居住，男性居民在住宅内可以安心睡眠，{newline}{newline}女性居民会为同一个住宅内的所有居民准备食物。夫妻可以在住宅内生儿育女。"
stringn 7 "一级货栈是最小型的货栈，可存放物资。维京人会在需要的时候从货栈将物品运走。{newline}{newline}每一种类的物资可以个别设定最小与期望的库存量，如果有指定搬运工或贸易商给{newline}{newline}某间货栈，他们会设法取得及维持物资的库存量在期望值之上。"
stringn 8 "二级货栈可存放物资。维京人会在需要的时候从货栈将物品运走。每一种类的物资{newline}{newline}可以个别设定最小与期望的库存量，如果有指定搬运工或贸易商给某间货栈，他们{newline}{newline}会设法取得及维持物资的库存量在期望值之上。"
stringn 9 "三级货栈可存放物资。维京人会在需要的时候从货栈将物品运走。每一种类的物资{newline}{newline}可以个别设定最小与期望的库存量，如果有指定搬运工或贸易商给某间货栈，他们{newline}{newline}会设法取得及维持物资的库存量在期望值之上。"
stringn 10 "水井会自动不断地提供水资源，被指定到水井的搬运工会将水运往烘焙工房、{newline}{newline}酿酒厂、或是炼金房。"
stringn 11 "蜂房中有蜜蜂忙碌着生产蜂蜜，搬运工会将蜂蜜运往烘焙工房或酿酒厂以制成蛋{newline}{newline}糕及蜂蜜酒。"
stringn 12 "农场让一或数个农夫在肥沃草地上种植小麦。小麦是磨制面粉的主原料，亦是某{newline}{newline}些建筑物屋顶的材料之一。农场的建造地点不必适合耕种，但小麦一定要种植在{newline}{newline}肥沃的青草地。"
stringn 13 "碾磨工房将小麦碾磨成面粉，碾制完成的面粉会装填成袋存放于碾磨工房门口，{newline}{newline}是烘焙美味面包的主要原料。"
stringn 14 "烘焙工房内，烘焙师傅用面粉与水烘焙出美味的面包。"
stringn 15 "二级烘焙工房可烘焙出美味的蛋糕。当维京人的科技与资源达到所需水准后便能{newline}{newline}建造二级烘焙工房。为了节省空间与经费，可以直接将一级烘焙工房升级为二级烘{newline}{newline}焙工房。"
stringn 16 "酿酒厂内，酿酒师用蜂蜜与水生产出香浓的蜂蜜酒。"
stringn 17 "牧农在牧场上看顾四处漫游的牲口。{newline}{newline}注意!要拥有基本数量的牛羊可饲养，必须让探勘家先寻得该牲口。{newline}{newline}绵羊提供肉与羊毛，母牛则提供肉与皮革。"
stringn 18 "一级缝纫工厂可生产皮鞋。所有赤脚的维京人都会不顾一切来取得一双皮鞋。{newline}{newline}穿上鞋子可以更加快速的行走。"
stringn 19 "二级缝纫工厂利用羊毛与皮革来生产皮盔甲与皮外套，此类衣物能够增加士兵的{newline}{newline}防御力。"
stringn 20 "一级陶艺工房内，陶匠将黏土烧制成砖块。砖块是大部份建筑物的建筑材料。"
stringn 21 "二级陶艺工房内，陶匠负责将黏土烧制成瓦片，许多建筑物都需要瓦片来建造屋顶。"
stringn 22 "三级陶艺工房内，技术纯熟的陶匠专门利用黏土来制成陶器。陶器让女子将住宅{newline}{newline}内的食物量增加为两倍。"
stringn 23 "一级木匠工房内，木匠将木头制成木制工具。木制工具帮助维京人增加生产力。{newline}{newline}此类建筑物最好建造于水边，有利于之后升级为四级木匠工房时可建造船只。"
stringn 24 "二级木匠工房内，木匠将木头制成家俱。此类建筑物最好建造于水边，有利于之{newline}{newline}后升级为四级木匠工房时可建造船只。"
stringn 25 "三级木匠工房内，木匠将木头制成木矛与手推车。此类建筑物最好建造于水边，{newline}{newline}有利于之后升级为四级木匠工房时可建造船只。"
stringn 26 "四级木匠工房内，木匠利用木头制作牛车与建造商船。四级木匠工房必须位于水{newline}{newline}边才能够建造船只。"
stringn 27 "一级防具铺内，防具商将木头制成长、短弓。"
stringn 28 "二级防具铺内，防具商利用木头制作投石机。"
stringn 29 "一级石窑内，石匠将石砾加工为石块。为方便取得石砾，此建筑最好位于存放石{newline}{newline}砾的地点附近。"
stringn 30 "二级石窑内，石匠将石砾精炼成大理石。为方便取得石砾，此建筑最好位于存放{newline}{newline}石砾的地点附近。"
stringn 31 "一级铁匠铺内，铁匠利用铁制作铁制工具。这类工具可大大提高维京人的生产力。{newline}{newline}此外，士兵使用的铁矛与短剑也是在此制作。"
stringn 32 "二级铁匠铺利用铁生产剑类武器。要维持铁匠铺内的炉火不灭，木头的稳定供给{newline}{newline}是必需的。此外，于战斗时保护士兵之铁盔甲也是在此制作。"
stringn 33 "铸币厂内，铸造工人将黄金铸成金币。必须维持木头的稳定供给让炉火不灭。{newline}{newline}金币是相当普遍的流通物品，并且时常被用来进贡。"
stringn 34 "采药师会在草药房周围的地面寻找野生植物，若无法找到任何可用的药草，他会自{newline}{newline}行种植特殊药草；这些药草是制作体力、生命、与活力药水的主要成份。{newline}{newline}草药房的建造地点不必适合种植，但采药师的种地一定是肥沃的青草地。"
stringn 35 "一级炼金房内，德鲁伊僧侣利用磨菇酿制出一种特殊油脂，此油脂是被用来点燃母{newline}{newline}舰与维京人住宅前的圣火。负责采集磨菇的采集者应将磨菇运送给德鲁伊僧侣{newline}{newline}以便他们酿制油脂。"
stringn 36 "二级炼金房主要提供维京人战斗所需之体力、生命、与活力药水。制作药水的成份{newline}{newline}除了磨菇与油之外，还需要水、药草与黄金。"
stringn 37 "神殿能增加维京人的宗教信仰。只有神殿能将圣火的魔力散播至其周围的建筑物，{newline}{newline}因此，像防具铺与铁匠铺这类需要宗教力量之建筑物应建造在神殿附近。"
stringn 38 "学校里，工人们不必费时累积工作经验或达到必要条件，就可以学习到新的职{newline}{newline}业技能；不过唯一的前提是，部落中必须有其他维京人已经具有该职业技能。"
stringn 39 "兵营里，男子可透过征召方式成为不同兵种之士兵。必须有一名以上的搬运工在兵{newline}{newline}营内工作，负责将装备运送至兵营内让士兵使用。"
stringn 40 "由维京人看守的一级防御塔台会自动反击靠近的敌人，驻守人员可同时包含三位长{newline}{newline}弓兵与二位短弓兵，以便增加攻击范围与防护力。"
stringn 41 "由维京人看守的二级防御塔台会自动反击靠近的敌人，驻守人员可同时包含四位长{newline}{newline}弓兵与四位短弓兵，以便增加攻击范围与防护力。"