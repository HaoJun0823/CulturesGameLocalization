[text]
stringn 0 "SPEZIAL CTF: DIE VIER JAHRESZEITEN"
stringn 1 "6 Spieler: Versuche deine fünf Flaggen vor der Eroberung zu schützen und gleichzeitig die der anderen Spieler einzunehmen!"
stringn 2 "Sichere deine Flaggen so gut wie möglich - ein paar besetzte Wachtürme pro Flagge können nicht schaden!"
stringn 3 "Um deine Flaggen wieder auszulösen kannst du dem Händler im Zentrum des Landes einen Reaktivierungstribut zahlen!"
stringn 4 "Baue so schnell wie möglich ein Schiff! Finde damit den Händler, deine Gegner und möglichst viele Schätze!"
stringn 5 "Du solltest deinen Händler mal einen Blick in die anderen Gebäude im Zentrum werfen lassen - auch sie bieten wertvolles..."
stringn 6 ""
stringn 100 "Du solltest schnell zahlen, bevor es richtig teuer wird:"
stringn 101 "Wenn du diesen Preis für schlimm hältst, dann warte besser auf dein Ende:"
stringn 102 "Ein paar Drachen gefällig? Die mußt du dir aber selbst auf meiner Insel abholen!"
stringn 103 "Nahrung für die Soldaten auf deiner Nachbarinsel? Das läßt sich machen! Zahle:"
stringn 104 "Ein paar Briefe zum Häuser setzen? Sieh in die Truhen bei deinem Hauptlager!"
stringn 200 "- Beschütze deine Flaggen!"
stringn 201 "- Erobere die der anderen!"
stringn 202 "- Baue schnell ein Schiff!"
stringn 203 "- Finde den Händler nahe des Zentrums!"
stringn 204 "- Löse über ihn verlorene Flaggen ein!"
