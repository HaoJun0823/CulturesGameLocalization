[text]
stringn 0 "驻扎待命，直至收到哈奇的消息。"
stringn 1 "为哈奇提供 20 名士兵，并在他的村庄建起 4 座防御塔。"
stringn 2 "@解救哈奇的村庄，使其脱离蛇患！"
stringn 3 "向米格尔送达 20 块金矿。"
stringn 4 "缴纳贡金，方可与撒拉逊人贸易。"
stringn 5 "若想招募佣兵并争取贸易伙伴，须缴纳拜占庭人所索的贡金。"
stringn 6 "跟随伊科尔前往“废弃村庄”。"
stringn 7 "寻找金矿山脉。"
stringn 8 "清除“废弃村庄”中的蛇群。"
stringn 32 "若要与渔村贸易，须缴 10 单位小麦作贡金。"
stringn 33 "若要与拜占庭人贸易，须缴 10 单位家具作贡金。"
stringn 34 "若想从米格尔处获取情报，须缴 20 单位金作贡金。"
stringn 35 "再缴 5 单位家具，可增募 5 名长弓手。"
