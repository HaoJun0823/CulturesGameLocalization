stringn 33 "Ein M黱zpr鋑er kann hier aus Gold M黱zen pr鋑en. Um das Pr鋑efeuer in Gang zu halten, wird ausreichend Holz ben鰐igt.Die M黱zen gelten als ein beliebtes Mittel f黵 Handel und Tributzahlungen."
stringn 34 "Ein Kr鋟tersammler sucht die Umgebung der Kr鋟terh黷te nach wildwachsenden Pflanzen ab und wenn er keine findet, baut er besondere Kr鋟terpflanzen selbst an. Diese dienen als Grundlage f黵 die Herstellung von Versorgungs-, Heil-, und Kampftr鋘ken. Der Bauuntergrund f黵 dieses Geb鋟de kann durchaus karg sein, aber die G鋜ten der Kr鋟tersammler daneben verlangen nach saftigen, gr黱en Boden."
stringn 35 "In der kleinen Alchemistenh黷te braut ein Druide aus Pilzen besonderes 謑, welches Brennmittel f黵 das heilige Feuer ist, das vor dem Hauptquartier und vor den Wohnh鋟sern der Wikinger entz黱det werden kann. Ein Abbauer sollte die Umgebung nach wildwachsenden Pilzen absuchen und dem Druiden bringen, damit dieser arbeiten kann."
stringn 36 "Die gro遝 Alchemistenh黷te ist n鰐ig, um die Wikinger mit Versorgungs-, Heil-, und Kampftr鋘ken auszustatten. F黵 die Herstellung dieser werden nicht nur Pilze und 謑 gebraucht, sondern auch Wasser, Kr鋟ter und Gold."
stringn 37 "Der Tempel dient der religi鰏en Motivation. Er ist das einzige Geb鋟de, welches die Magie des heiligen Feuers an die Umgebung abstrahlt und sollte folglich in der N鋒e von Berufsst鋞ten gebaut werden, die auf dies Motivation angewiesen sind, also in die N鋒e von Waffenbauer und Schmied."
stringn 38 "In der Schule k鰊nen Wikinger neue Berufe ohne zeitraubende Berufspraxis und folglich ohne Vorkenntnisse erlernen. Voraussetzung ist, dass der Beruf von einen ihrer Wikinger bereits ausf黨rbar ist."
