stringn 0 "Suche die Abtei."
stringn 1 "Finde die drei Schwerter der verstorbenen Könige."
stringn 2 "Sprich mit dem Fährmann südlich der Frankenstadt."
stringn 3 "Suche das Orakel mit deinen 5 Helden auf."
stringn 4 "Versuche mit ALLEN Helden in die Katakomben zu gelangen. Zahle dazu dem fränkischen Tyrann den geforderten Tribut oder bekämpfe ihn."
stringn 5 "Finde den Schmied Johannes, um die Kette zu schmieden"
stringn 6 "Finde die grauen Druiden, um die Kette weihen zu lassen."
stringn 7 "Backe Kuchen und reiche sie den Söldnern zum Tribut, damit sie deine Wikinger bei der Mission begleiten."
stringn 8 "Zahle den Druiden 10 Pilze Tribut"
stringn 9 "Zahle 20 Kurzschwerter Tribut, wenn der Schmied Johannes die Kette schmieden soll."
stringn 10 "Bezahle den Fuhrmann für die Überfahrt."
stringn 31 "Spende den Mönchen 10 Kräuter für das Wohlergehen ihrer Abtei."
stringn 32 "Reiche dem fränkischen für eine neutrale Haltung Tyrann 30 Münzen zum Tribut."
stringn 33 "Locke mit 5 Kuchen 5 Söldner von Sigurd aus der Reserve!"
stringn 34 "Zahle dem Fährmann 10 Met Tribut für die Überfahrt zu Insel."
stringn 35 "Zahle 20 Kurzschwerter Tribut, wenn der Schmied die Kette schmieden soll."
stringn 36 "Zahle 10 Pilze Tribut, wenn die Druiden die Kette weihen sollen."
