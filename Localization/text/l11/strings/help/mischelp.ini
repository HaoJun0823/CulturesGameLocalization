[control]
stringidmultiplier 1
[text]
stringn 0 "箱子"
string "箱子有時可以在城市或地圖上找到。它們通常包含稀有和有用的物品，如藥水和護符。{newline}{newline}普通箱子可以由任何維京人開啟，無論男女。"
string "魔法箱子"
string "這些特殊箱子有時可以在城市或地圖上找到。它們通常隱藏著稀有和非常有用的物品，如神秘藥水和魔法護符。{newline}{newline}魔法箱子只能由德魯伊開啟。"
string "綿羊"
string "這些毛茸茸的動物主要為維京人提供羊毛，也提供食物。{newline}{newline}綿羊必須先被馴化。偵察兵必須找到它們並將它們帶到畜牧場，方法是從它們附近走過。當他捕獲一隻綿羊時，它會獲得你的玩家顏色標記。"
string "牛"
string "棕色的牛為維京人提供皮革和食物。{newline}{newline}牛必須先被馴化。偵察兵必須找到它們並將它們帶到畜牧場，方法是從它們附近走過。當他捕獲一頭牛時，它會獲得你的玩家顏色標記。"
string "投石機"
string "建造成本：10木材{newline}{newline}投石機只有在你的一名士兵坐在操縱桿後面，即分配給該車輛時才能工作。它移動相當笨拙，防護也不好，但對建築的效果遠勝於士兵。{newline}{newline}注意！由於其體積和重量，投石機無法穿過橋樑！因此，如果你想讓投石機過河，必須尋找淺灘。"
string "手推車"
string "建造成本：2木材{newline}{newline}商人可以使用手推車在兩個建築之間同時運輸多達10件物品。要使用它，你必須將商人分配給手推車。他們會自動將其用作運輸工具。{newline}{newline}搬運工可以使用手推車在野外收集物品。為此，你必須在手推車中設定所需的物品數量。搬運工會將手推車裝滿這些物品。現在將手推車送到目的地，然後可以用'解除安裝'按鈕解除安裝。"
string "牛車"
string "建造成本：5木材。需要一頭牛作為牽引動物。{newline}{newline}商人可以使用牛車在兩個建築之間同時運輸多達20件物品。要使用它，你必須將商人分配給牛車。他們會自動將其用作運輸工具。{newline}{newline}搬運工可以使用牛車在野外收集物品。為此，你必須在手推車中設定所需的物品數量。搬運工會將車裝滿這些物品。現在將牛車送到目的地，然後可以用'解除安裝'按鈕解除安裝。"
string "船隻"
string "建造成本：10木材，5皮革{newline}{newline}要出海，船只需要一名指揮官。將你的一名維京人分配給船隻（'分配車輛'），使其成為指揮官。你還可以將更多維京人作為乘客送上船。{newline}{newline}要裝載貨物，你必須至少分配一名搬運工給船隻。他可以獨自裝卸船隻。所需的物品數量在船隻視窗中透過物品符號旁邊的加號和減號按鈕設定。搬運工會裝載或解除安裝，直到達到所需數量。{newline}{newline}要出海，右鍵點選船隻將其送到海上的目標位置。所有乘客上船後，船隻即啟航。{newline}{newline}要靠岸，你必須給船隻下達'靠岸'命令。{newline}{newline}船隻靠岸後，可以由搬運工解除安裝。使用'刪除'命令將所有貨物卸下。使用'解除安裝'命令將貨物和人員都卸下。如果只想卸下部分貨物，請在船隻視窗中使用相應物品旁邊的減號按鈕減少其數量。"
string "柵欄"
string "建造成本：1木材{newline}{newline}與人等高的圍欄不僅能很好地防禦攻擊者，也是抵禦野生動物的有效屏障。"
string "門"
string "建造成本：-{newline}{newline}門允許你的維京人順利離開用柵欄圍起來的村莊。它們只能放置在已有柵欄牆且呈直線的位置。"
