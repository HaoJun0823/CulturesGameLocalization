[text]
stringn 1 "水是从地底汲取上来的，搬运工将其运往需要水资源的工作地点，{newline}{newline}如烘焙工房、酿酒厂或者炼金房等。"
stringn 2 "黏土是由专门采集黏土的采集者收集而来。"
stringn 3 "石砾是由专门采集石砾的采集者收集而来。"
stringn 4 "小麦是农夫在肥沃的土地上种植收割而来。碾磨工房磨制面粉与牧农{newline}{newline}喂食牲口都需要小麦，同时，小麦也是建筑材料之一。"
stringn 5 "木头是由专门砍伐木头的采集者收集而来。"
stringn 6 "铁是由经验丰富、专门采集铁矿的采集者收集而来。"
stringn 7 "黄金是由经验丰富、专门采集金矿的采集者收集而来。"
stringn 8 "金币由黄金铸造而成，是维京人相当普遍的流通物品。"
stringn 9 "皮革是猎人在森林中猎杀动物而来(麋鹿、野猪...)，或是由牧农饲养牛只{newline}{newline}而来。"
stringn 10 "羊毛是由牧农饲养绵羊而来。"
stringn 11 "面粉是由碾磨工人磨制小麦而来。"
stringn 12 "蜂蜜是由蜜蜂采集而来，运送者将蜂蜜运往烘焙工房或是酿酒厂以便生{newline}{newline}产蛋糕或是蜂蜜酒。"
stringn 13 "药草由采药师采集、晒制、储存而成，是二级炼金房内所有药水的主要成份。"
stringn 14 "磨菇由专门采集磨菇的采集者采收，然后经德鲁伊僧侣将其制成油脂。"
stringn 15 "油脂由德鲁伊僧侣以磨菇磨制而成，是每一个住宅前所放置的圣火所需。"
stringn 16 "食物是维京人生活之必需，维持其稳定供应是每一任务的致胜因素之一。{newline}{newline}猎人、渔夫、烘焙师傅与牧农都是食物的生产者。"
stringn 17 "蛋糕是一种特别的食物，吃了蛋糕的维京人较不易感到饥饿，社交需求也{newline}{newline}会跟着下降。蛋糕是由二级烘焙工房烘烤而成。"
stringn 18 "野莓可由维京人任意从树丛中采集而得，吃了野莓可以暂时舒缓饥饿的{newline}{newline}感受。"
stringn 19 "面包由烘焙师傅以面粉与水为原料烘焙而成。"
stringn 20 "蛋糕是一种特别的食物，吃了蛋糕的维京人较不易感到饥饿，社交需求也{newline}{newline}会跟着下降。蛋糕是由二级烘焙工房烘烤而成。"
stringn 21 "肉是由猎人在森林里猎杀动物或是牧农饲育牛、羊而来。"
stringn 22 "鱼由渔夫捕捉而来，是维京人最容易取得的食物之一。"
stringn 23 "腊肠由牧农以牛、羊肉腌制而成，是维京人最容易取得的食物之一。"
stringn 43 "蜂蜜酒是由酿酒师以蜂蜜及水酿制而成。"
stringn 24 "砖块由陶匠以黏土制成，另外还需要木头作为烧陶之用。砖块是许多建筑{newline}{newline}物的必需材料。"
stringn 25 "瓦片由陶匠以黏土制成，另外还需要木头作为烧陶之用。瓦片是许多高等{newline}{newline}建筑物的屋顶材料。"
stringn 26 "石块由石匠以石砾制成，是所有建筑物之基本材料。"
stringn 27 "大理石由石匠以石砾制成，是高等建筑物的所需材料。"
stringn 28 "陶器由陶匠以黏土制成，另外还需要木头作为烧陶之用。有了陶器，女子能{newline}{newline}够烹调食物，将食物量增为两倍。"
stringn 29 "家俱由木匠以木头制成。在住宅里居住的女子会自动采买家俱。家俱能{newline}{newline}够提升生活水准，因为维京人在床上将可以获得较良好的睡眠品质，进{newline}{newline}一步维持较久的清醒时间。"
stringn 30 "所有赤脚的维京人都渴望拥有一双皮鞋，穿上皮鞋能使行动速度加快并{newline}{newline}减少体能之耗费。"
stringn 31 "木制工具由木匠以木头制成，可提高工人的生产力。"
stringn 32 "铁制工具由铁匠以铁制成，可大大提高工人的生产力。"
stringn 33 "皮外套以羊毛与皮革制成，是士兵的防护衣类型之一；对于弓箭有较好的{newline}{newline}防御力，但对于其他武器的防御力近似于零。"
stringn 34 "皮盔甲以皮革制成，是士兵的防护衣类型之一；除了长剑与投石机的攻击{newline}{newline}较难防御外，对于全身算是提供了良好的防护功能。"
stringn 35 "锁子甲以铁制成，是士兵的防护衣类型之一；除了铁矛和投石机的攻击较{newline}{newline}难防御外，几乎能够抵挡所有武器的攻击。"
stringn 36 "铁盔甲以铁制成，是士兵的防护衣类型之一；可以防御投石机的攻击，乃属{newline}{newline}极佳之防具。"
stringn 37 "短弓由防具商以木头制成，有助于远距离攻击，攻击距离与攻击力皆属{newline}{newline}中等。"
stringn 38 "长弓由防具商以木头制成，是远距离攻击的最佳武器，攻击距离与攻击力{newline}{newline}皆相当杰出。"
stringn 39 "木矛由木匠以木头制成，是简单型的中等距离近战武器。"
stringn 40 "铁矛由铁匠于木矛上增加一坚硬铁片加工而成。因此，要制造铁矛必须有{newline}{newline}木矛与铁为原料。铁矛是相当不错的中等距离近战武器。"
stringn 41 "短剑由铁匠以铁炼造而成，属于杀伤力中等的短距离近战武器。"
stringn 42 "长剑由铁匠以铁炼造而成，属于高杀伤力的中等距离近战武器，对付投石{newline}{newline}机相当有效率。"
stringn 44 "小瓶体力药水由德鲁伊僧侣于二级炼金房内使用水、药草、磨菇与秘方{newline}{newline}炼制而成。除了英雄之外，维京人中所有男子均可携带此种药水。每一小{newline}{newline}瓶体力药水可服用两次，服用药水后可维持较长一段时间不需进食。{newline}{newline}德鲁伊僧侣需要黄金来制成神秘且珍贵的秘方。"
stringn 45 "大瓶体力药水由德鲁伊僧侣于二级炼金房内使用水、药草、磨菇与秘方{newline}{newline}炼制而成。除了英雄之外，维京人中所有男子均可携带此种药水。每一大{newline}{newline}瓶体力药水可服用五次，服用药水后可维持较长一段时间不需进食。{newline}{newline}德鲁伊僧侣需要黄金来制成神秘且珍贵的秘方。"
stringn 46 "小瓶活力药水由德鲁伊僧侣于二级炼金房内使用水、药草、磨菇与秘方{newline}{newline}炼制而成。除了英雄之外，维京人中所有男子均可携带此种药水。每一小{newline}{newline}瓶活力药水可服用两次，服用药水后会有较长一段时间保持清醒与活力。{newline}{newline}德鲁伊僧侣需要黄金来制成神秘且珍贵的秘方。"
stringn 47 "大瓶活力药水由德鲁伊僧侣于二级炼金房内使用水、药草、磨菇与秘方{newline}{newline}炼制而成。除了英雄之外，维京人中所有男子均可携带此种药水。每一大{newline}{newline}瓶活力药水可服用五次，服用药水后会有较长一段时间保持清醒与活力。{newline}{newline}德鲁伊僧侣需要黄金来制成神秘且珍贵的秘方。"
stringn 48 "小瓶生命药水由德鲁伊僧侣于二级炼金房内使用水、药草、磨菇与秘方{newline}{newline}炼制而成。除了英雄之外，维京人中所有男子均可携带此种药水。每一小{newline}{newline}瓶生命药水可服用两次，服用药水可以治愈受到野兽或敌人侵略所受的{newline}{newline}伤害。德鲁伊僧侣需要黄金来制成神秘且珍贵的秘方。"
stringn 49 "大瓶生命药水由德鲁伊僧侣于二级炼金房内使用水、药草、磨菇与秘方{newline}{newline}炼制而成。除了英雄之外，维京人中所有男子均可携带此种药水。每一大{newline}{newline}瓶生命药水可服用五次，服用药水可以治愈受到野兽或敌人侵略所受的{newline}{newline}伤害。德鲁伊僧侣需要黄金来制成神秘且珍贵的秘方。"
stringn 50 "体力护身符可让佩带者永不感到饥饿，不过只能透过与他人交易或是从{newline}{newline}宝箱中取得。维京人中除了女子与英雄之外皆能佩带。护身符永远不会消{newline}{newline}失。"
stringn 51 "活力护身符可让佩带者永不感到疲劳，不过只能透过与他人交易或是从{newline}{newline}宝箱中取得。维京人中除了女子与英雄之外皆能佩带。护身符永远不会消{newline}{newline}失。"
stringn 52 "力量护身符可让佩带者于战斗时提高百分之五十的力量，不过只能透过{newline}{newline}与他人交易或是从宝箱中取得。维京人中除了女子与英雄之外皆能佩带。{newline}{newline}护身符永远不会消失。"
stringn 53 "防御护身符能够降低野兽与敌人对于佩带者的攻击伤害，不过只能透过{newline}{newline}与他人交易或是从宝箱中取得。维京人中除了女子与英雄之外皆能佩带。{newline}{newline}护身符永远不会消失。"
stringn 54 "精准护身符可让佩带者于攻击野兽或敌人时有百分之二十的机率发出平{newline}{newline}常两倍的力量，不过只能透过与他人交易或是从宝箱中取得。维京人中除{newline}{newline}了女子与英雄之外皆能佩带。护身符永远不会消失。"
stringn 55 "风之护身符可让佩带者快速地行动，不过只能透过与他人交易或是从宝{newline}{newline}箱中取得。维京人中除了女子与英雄之外皆能佩带。护身符永远不会消失。"
stringn 56 "猎人可以生产肉、皮革、与羊毛。"
stringn 57 "绵羊"
stringn 58 "牛"