stringn 8 "前往方尖碑，查明暗黑势力迟迟未被驱逐的根由！"
stringn 9 "向撒拉逊人运入 30 大理石入城，否则与之交战！必要时自建仓库。"
stringn 10 "统一这座分裂之城！寻得各方市长，将他们带往方尖碑！"
stringn 11 "向沼泽部族缴纳 25 单位草药作贡金！"
stringn 12 "由一名西北岛民的居民引航，前往遥远的东南岛民处！"
stringn 13 "与全部英雄返回方尖碑！"
