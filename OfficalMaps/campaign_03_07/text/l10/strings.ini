stringn 0 "@协助建成并守卫吉萨金字塔！"
stringn 1 "建立一座小型聚落。"
stringn 2 "前往工地。"
stringn 3 "向金字塔运送 50 石料、40 大理石柱与 70 金。"
stringn 4 "务必在金字塔旁建起至少一座仓库。"
stringn 5 "为埃及人提供至少 25 名士兵。"
stringn 6 "击退暗黑军团的进攻。"
stringn 7 "向商人缴纳 45 单位蜂蜜作贡金。"
stringn 8 "为换取佣兵，向拜占庭人缴纳其所索贡金。"
stringn 9 "向贝都因人进献武器作贡金，他们便随你们出战。"
stringn 10 "与你的英雄返回金字塔！"
stringn 11 "前往商人米格尔处！"
stringn 12 "若需米格尔相助，便向其缴纳贡金！"
stringn 13 "若想援助此族，便去寻其余贝都因部落！"
stringn 14 "为换取法老战士，向埃及人缴纳其所索贡金。"
stringn 15 "向魔法师进献 100 单位草药，以筑魔法护壁。"
