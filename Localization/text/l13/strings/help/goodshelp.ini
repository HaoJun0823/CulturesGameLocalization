[text]
stringn 1 "물은 땅속 깊은 곳에서 퍼 올려지며, 운반인이 제과점, 양조장, 연금술사의 오두막 같은 필요한 작업장으로 옮깁니다."
stringn 2 "점토는 생산을 점토로 설정한 채집꾼들이 캐냅니다."
stringn 3 "부석은 생산을 부석으로 설정한 채집꾼들이 바위 덩어리에서 잘라냅니다."
stringn 4 "밀은 농부들이 비옥한 땅에서 재배합니다. 밀은 제분소에서 밀가루를 만드는 데 필요하고, 목축업자에게는 사료로, 그리고 건물의 건축 자재로 사용됩니다."
stringn 5 "목재는 생산을 목재로 설정한 채집꾼들이 벌목합니다."
stringn 6 "철은 생산을 철로 설정한 숙련된 채집꾼들이 채굴합니다."
stringn 7 "금은 생산을 금으로 설정한 숙련된 채집꾼들이 채굴합니다."
stringn 8 "금화는 금으로 만들어져 바이킹 사이에서 인기 있는 교역품입니다."
stringn 9 "가죽은 사냥꾼이 숲의 동물(노루, 멧돼지 등)에게서, 또는 목축업자가 목장의 소에게서 얻습니다."
stringn 10 "양모는 목축업자가 양에게서 얻습니다."
stringn 11 "제분업자가 농부의 밀을 갈아 밀가루를 만듭니다."
stringn 12 "꿀은 부지런한 벌들로부터 얻습니다. 운반인이 꿀을 제과점이나 양조장으로 가져가 케이크나 꿀술을 만드는 데 사용합니다."
stringn 13 "약초는 약초 채집꾼이 채집하여 건조하고 저장합니다. 약초는 연금술사의 오두막2에서 영양·치유·전투 물약을 만드는 기본 재료가 됩니다."
stringn 14 "버섯은 채집꾼이 모으며, 드루이드가 이를 기름으로 가공할 수 있습니다."
stringn 15 "기름은 드루이드가 채집꾼이 모은 버섯으로 만듭니다. 모든 주택 앞에 성화를 피우는 데 필요합니다."
stringn 16 "식량은 모든 바이킹에게 필요합니다. 그러므로 제대로 작동하는 식량 공급은 미션의 성공에 매우 중요합니다. 식량은 사냥꾼, 어부, 제빵사, 목축업자가 생산합니다."
stringn 17 "케이크는 바이킹의 허기를 오랫동안 채워주고 사회적 욕구도 낮추는 특별한 식량입니다. 케이크는 제과점2에서 굽습니다."
stringn 18 "모든 바이킹은 딸기 덤불에서 과일을 수확할 수 있습니다. 과일은 잠시 배고품을 달래줍니다."
stringn 19 "빵은 제빵사가 굽습니다. 이를 위해 제분소의 밀가루와 우물의 물이 필요합니다."
stringn 20 "케이크는 바이킹의 허기를 오랫동안 채워주고 사회적 욕구도 낮추는 특별한 식량입니다. 케이크는 제과점2에서 굽습니다."
stringn 21 "고기는 사냥꾼이 숲의 동물에게서, 또는 목축업자가 소와 양에게서 얻습니다."
stringn 22 "생선은 어부가 낚으며, 바이킹의 가장 기본적인 식량 중 하나입니다."
stringn 23 "소시지는 목축업자가 소와 양으로 만들며, 바이킹의 가장 기본적인 식량 중 하나입니다."
stringn 43 "꿀술은 양조사가 담급니다. 꿀과 물이 필요합니다."
stringn 24 "벽돌은 도공이 점토로 구워냅니다. 점토 외에도 연료용 목재가 필요합니다. 벽돌은 많은 건물의 건축 자재로 필요합니다."
stringn 25 "기와는 도공이 점토로 구워냅니다. 점토 외에도 연료용 목재가 필요합니다. 기와는 고급 건물의 지붕 건축 자재로 필요합니다."
stringn 26 "석재는 석공이 부석으로 깎아 만듭니다. 건물의 건축 자재로 필요합니다."
stringn 27 "대리석은 석공이 석재 블록으로 만듭니다. 고급 건물의 건축 자재로 필요합니다."
stringn 28 "식기는 도공이 점토로 구워 만듭니다. 굽기 위해 목재가 필요합니다. 식기가 있으면 여성이 요리를 할 수 있고, 그렇게 하여 식량의 양을 두 배로 만들 수 있습니다."
stringn 29 "가구는 목수가 목재로 만듭니다. 집에 사는 여성은 가구를 스스로 가지러 갑니다. 가구가 있으면 딱딱한 바닥보다 침대에서 자는 것이 더 편하기 때문에 주거의 쾌적성이 올라갑니다. 그 결과 바이킹은 더 잘 휴식하고 더 오래 깨어 있을 수 있습니다."
stringn 30 "맨발인 바이킹은 누구나 가죽 신발을 갖고 싶어 합니다. 신발을 신은 바이킹은 더 빨리 이동하고 에너지 소비도 줄입니다."
stringn 31 "목제 도구는 도구 목수가 목재로 만듭니다. 그것을 사용하는 바이의 생산성을 높입니다."
stringn 32 "철제 도구는 대장장이 철로 만들 수 있습니다. 그것을 사용하는 바이킹의 생산성을 크게 향상시킵니다."
stringn 33 "천 갑옷은 양모와 가죽으로 만듭니다. 병사가 옷과 보호 장비로 착용합니다. 화살에는 특히 강하지만 검베기와 투석기에는 취약합니다."
stringn 34 "가죽 갑옷은 가죽으로 만들며 병사가 옷으로 착용합니다. 장검과 투석기를 제외한 어떤 무기에도 좋은 전면 보호를 제공합니다."
stringn 35 "사슬 갑옷은 철로 만들어 병사가 옷으로 착용하며, 착용자를 거의 모든 종류의 무기에서 보호합니다. 단 철창과 투석기에는 다소 취약합니다."
stringn 36 "판금 갑옷은 철로 만듭니다. 병사가 옷과 보호로 착용합니다. 가장 바라는 최고의 갑옷으로, 병사를 투석기에서도 지켜 줍니다."
stringn 37 "짧은 활은 무기 장인이 목재로 만듭니다. 멀리 있는 적을 공격하기 좋은 무기입니다. 사거리와 관통력이 균형을 이루습니다."
stringn 38 "장궁은 무기 장인이 목재로 만듭니다. 아주 먼 거리에서 적을 공격하는 훌륭한 무기입니다. 사거리와 관통력이 뛰어납니다."
stringn 39 "나무 창은 목수가 목재로 만듭니다. 목창은 중간 사거리를 가진 단순한 근접 무기입니다."
stringn 40 "철 창은 대장장이가 단단한 철창을 붙인 나무 창입니다. 이를 위해 철과 나무 창이 필요합니다. 철 창은 중간 사거리의 좋은 근접 무기입니다."
stringn 41 "단검은 대장장이 철로 단강됩니다. 단검은 짧은 사거리와 중간 정도 관통력을 가진 근접 무기입니다."
stringn 42 "장검은 대장장이 철로 단강합니다. 장검은 중간 사거리와 높은 관통력을 가진 근접 무기입니다. 특히 발석기에 매우 효과적으로 사용할 수 있습니다."
stringn 44 "소형 영양 물약은 큰 연금술사의 오두막에서 드루이드가 물, 약초, 버섯, 비밀 재료로 만듭니다. 영웅을 제외한 모든 남성 바이의 장비시킬 수 있습니다. 배가 고프면 자동으로 두 번 사용하여 식량 없이 더 긴 거리를 이동할 수 있습니다. 그 후 물약은 소모됩니다. 드물고 비밀스러운 재료를 위해 드루이드는 금도 추가로 필요로 합니다."
stringn 45 "대형 영양 물약은 큰 연금술사 오두막에서 드루이드가 물, 약초, 버섯, 비밀 재료로 만듭니다. 영웅을 제외한 모든 남성 바이킹에게 장착할 수 있습니다. 배고플 때 자동으로 다섯 번 사용하여 식량 없이 더 긴 거리를 갈 수 있습니다. 물약은 사용하면 소모됩니다. 비밀에 싸인 희귀 재료를 위해 드루이드는 금도 더 필요합니다."
stringn 46 "소형 체력 물약은 큰 연금술사의 오두막에서 드루드가 물, 약초, 버섯, 비밀 재료로 만듭니다. 영웅을 제외한 모든 남성 바이킹에게 장착할 수 있습니다. 피로가 밀려오면 자동으로 두 번 사용하여 더 오랫동안 깨어 활동할 수 있습니다. 비밀스럽고 극히 희귀한 재료를 위해 드루이드가 금이 필요합니다."
stringn 47 "대형 체력 물약은 큰 연금술사 오두모에서 드루이드가 물리, 약초, 곰팡, 비밀 재료로 만듭니다. 영웅을 제외한 모든 남성 바이 바이킹에게 장착 할 수 있습니다. 피곤해지면 자동으로 다섯 번 사용하여 더 오래 깨어 활동할 수 있습니다. 드물고 비밀스러운 재료를 위해 드루이드는 금 추가로 필요합니다."
stringn 48 "소형 치유 물약은 큰 연금술사의 오두막에서 드루이드가 물, 약초, 버섯, 비밀 재료로 만듭니다. 영웅을 제외한 모든 남성 바이킹에게 장착할 수 있습니다. 야생 짐승이나 적과의 싸움에서 다쳤을 때 자동으로 두 번 사용합니다. 극히 희귀한 비밀 재료를 위해 드루이드에게 금이 필요합니다."
stringn 49 "대형 치유 물약은 큰 연금술사의 오두막에서 드루이드가 물, 약초, 버섯, 비밀 재료로 만듭니다. 영웅을 제외한 모든 남성 바이킹이 장비할 수 있습니다. 야생 짐승이나 적과의 싸움에서 상처를 입으면 자동으로 다섯 번 사용합니다. 비밀스럽고 매우 희귀한 재료를 위해서는 드루이드에게 금이 추가로 필요합니다."
stringn 50 "영양의 부적은 착용자를 허기로부터 지켜 줍니다. 만들 수 없고 오직 발견하거나 다른 민족과의 교역으로 획득할 수 있습니다. 여성과 영웅을 제외한 모든 바이킹이 착용할 수 있습니다. 소모되지 않습니다."
stringn 51 "체력의 부적은 피로로부터 착자를 지켜 줍니다. 만들 수 없고, 발견하거나 다른 민족과의 무역으로만 획득할 수 있습니다. 여성과 영웅을 제외한 모든 바이킹이 착용할 수 있습니다. 절대로 소모되지 않습니다."
stringn 52 "힘의 부적은 공격 시 착용자의 힘을 50% 증가시킵니다. 만들 수 없지만 발견하거나 다른 민족과의 무역으로 얻을 수 있습니다. 여성과 영웅을 제외한 모든 바이킹이 착용할 수 있습니다. 절대 소모되지 않습니다."
stringn 53 "방어 부적은 야수와 적대 민족의 공격을 약화시켜 착용자의 건강을 보호합니다. 제작은 불가능하며 발견하거나 다른 민족과의 무역으로만 얻을 수 있습니다. 여성과 영웅을 제외한 모든 바이킹이 착용할 수 있습니다. 소모되지 않습니다."
stringn 54 "명중의 부적은 20%의 확률로 야생 동물과 적에 대한 착용자의 힘을 두 배로 만듭니다. 만들 수는 없고 발견하거나 다른 민족과 무역하여 얻을 수 있습니다. 여성과 영웅을 제외한 모든 바이킹이 착용할 수 있습니다. 절대 소모되지 않습니다."
stringn 55 "바람의 부적은 착용자에게 속도를 주어 더 빠르게 이동할 수 있습니다. 제작은 불가능하며 발견하거나 다른 민족과의 무역으로 얻습니다. 여성과 영웅을 제외한 모든 바이킹이 착용 가능합니다. 절대 소진되지 않습니다."
stringn 56 "사냥꾼의 사냥감에는 고기, 가죽, 양모가 포함됩니다."
stringn 57 "양"
stringn 58 "소"