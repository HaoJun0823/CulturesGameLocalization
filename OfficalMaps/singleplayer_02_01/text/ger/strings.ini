stringn 0 "Baue deine Nahrungsversorgung auf!"
stringn 1 "Vernichte die Bedrohung im Schlangenmoor!"
stringn 2 "Öffne den Eingang zum geheimen Stollen, der zur anderen Seite des Gebirges führt!"
stringn 3 "Öffne den Zugang zu der Höhle, in der sich der zweite Schalter befindet!"
stringn 4 "Zahle den Tribut, um mit dem Bergbauervolk handeln zu können."
stringn 6 "Finde das Versteck der Flüchtlinge! Du hast nur wenig Zeit!"
stringn 7 "Vernichte die Wolfsmenschen, welche dem Stamm Miguels so viel Kummer und Leid brachten!"
stringn 8 "Betritt mit Bjarni den Eingang der Wolfshöhle!"
stringn 9 "Schenke Miguel per Tribut ein Langschwert, einen Eisenspeer und einen Langbogen, damit er mit diesen Waffen üben kann!"
stringn 11 "Erkunde deine Umgebung!"
stringn 13 "Betritt nun mit Bjarni den Stollen im Nordwesten, durch den Miguel in das Tal kam!"
stringn 21 "Gib Miguel etwas zu essen und geselle dich dann wieder zu ihm!"
stringn 12 "Erwirb eine Landkarte von Miguel!"
stringn 14 "Schenke den Flüchtlingen die geforderten Waren."
stringn 15 "Erforsche das Schlangenlabyrinth!"
stringn 16 "Gib Miguel Kuchen und Met!"
stringn 17 "Bezahle Miguel den Tribut, um mit ihm handeln zu können!"
stringn 18 "Versuche, so schnell wie möglich auf die andere Seite des Tals zu gelangen. Vielleicht findest du noch Überlebende!"
