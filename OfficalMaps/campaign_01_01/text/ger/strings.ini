[text]
stringn 0 "Erreiche das Dorf."
stringn 1 "Spreche mit dem Druiden."
stringn 2 "Gehe zum Bootsbauer."
stringn 3 "Zahle den gewünschten Tribut."
stringn 4 "Finde die Nornen."
stringn 5 "Bezahle 10 Met Tribut für das Boot."
stringn 13 "Mache einige deiner Zivilisten zu Bauarbeitern."
stringn 14 "Baue eine Farm."
stringn 15 "Mache einen deiner Wikinger zum Farmer und siehe zu, wie er Erfahrung sammelt."
stringn 17 "Baue eine Mühle."
stringn 18 "Mache den Farmer zum Müller und siehe zu, wie er Erfahrung sammelt."
stringn 20 "Baue einen Brunnen."
stringn 21 "Baue eine Bäckerei."
stringn 22 "Mache den Müller zum Bäcker, den Farmer zum Müller und einen anderen Wikinger zum Farmer."
stringn 23 "Baue einen Bienenstock."
stringn 24 "Baue eine Brauerei."
stringn 25 "Warte, bis dein Bäcker genug Erfahrung gesammelt hat und mache dann deinen Bäcker zum Braumeister."
stringn 50 "Bootsbauer"
stringn 51 "Nornen"
stringn 52 "Druide"
stringn 100 "Bjarni"
stringn 99 "GRÖNLAND"
stringn 98 "Ruhig und beschaulich verläuft das Leben in dem kleinen, verschlafenen Dorf an der Küste Grönlands, bis zu jenem denkwürdigen Tag..."