[text]
stringn 0 "Baue dein Dorf auf!"
stringn 1 "Besuche den Handelsposten der Sarazenen!"
stringn 2 "Finde den Druiden im Norden des Dorfes!"
stringn 3 "Gib dem Druiden Begleitschutz!"
stringn 4 "Zahle den Tribut, um die Goldmangies friedlich zu stimmen!"
stringn 5 "Zahle diesen Tribut, oder es wird keine Freundschaft mit dem Goldmangies geben!"
stringn 6 "Finde den Granit der Weisen!"
stringn 7 "Erkunde das Geheimnis des Nebels des Grauen!"
stringn 8 "Baue ein Schiff, um die weitere Gegend erforschen zu können!"
stringn 9 "Finde den geheimnisvollen Nebel, der die Händler in solche Panik versetzt hat!"
stringn 10 "Suche nach Hinweisen und Möglichkeiten, um den Nebel durchqueren zu können!"
stringn 11 "Erreiche die Insel im Nebel mit Bjarni und mindestens acht Mann!"
stringn 12 "Zahle den Tribut, wenn du Frieden mit den Hütern des Wissens möchtest!"
stringn 13 "Wenn du möchtest, hilf dem Helluländer und sende ihm drei Frauen zur Vermählung!"
stringn 30 "Zahle, um deine Aufrichtigkeit zu beweisen:"
stringn 31 "Ohne diesen Tribut wirst du nicht friedlich an das Gold kommen!"
stringn 32 "Zahle, wenn du Frieden mit den Hütern des Wissens möchtest!"
stringn 33 "Zahle den symbolischen Betrag, damit das Abkommen Gültigkeit erlangt!"
stringn 34 "Zahle erneut, damit auch das nächste Abkommen Gültigkeit erlangt!"
stringn 35 "Wenn du mehr Informationen wünschst, dann zahle:"
