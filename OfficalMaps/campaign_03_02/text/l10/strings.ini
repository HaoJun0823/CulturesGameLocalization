stringn 0 "@协助建造塞米拉米斯空中花园！"
stringn 1 "寻找营建花园的地点！"
stringn 2 "建立一座小型聚落。"
stringn 3 "向花园运送 80 木材、40 石料、40 黏土与 40 砖块，以筑人造山阶！"
stringn 4 "在花园附近开凿 9 口井，以引水上行。"
stringn 5 "寻找 25 头牛！"
stringn 6 "解救牧人的妇孺，以换得他们的牛与一份建造图样。"
stringn 7 "向强盗缴纳 50 枚钱币，否则与之交战。"
stringn 8 "搜查强盗的营地。"
stringn 9 "将妇孺送返她们的村庄。"
stringn 10 "寻得建造图样。"
stringn 11 "为换取巴比伦的勇兵，须缴 5 单位铁作贡金。"
stringn 12 "向科布尔人进献 10 双鞋作贡金。"
stringn 13 "前往地下厅堂！"
stringn 14 "与你的英雄返回花园！"
