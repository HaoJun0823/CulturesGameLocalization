[text]
stringn 0 "指派一名维京人从事采泥工之职。"
stringn 1 "指派两名维京人分别从事伐木工与采石工之职。"
stringn 2 "接着，将若干尚未谋职的部众转为建筑工人！"
stringn 3 "让你的建筑工人兴建一座农场！"
stringn 4 "指派一名部众到农场担任农夫，并待其晋为行家。"
stringn 5 "建造一座磨坊。"
stringn 6 "现在将农夫转为磨坊主。"
stringn 7 "建造一口水井。"
stringn 8 "建造一间烘焙坊。"
stringn 9 "将磨坊主转为烘焙师。"
stringn 10 "再次指派一名磨坊主到磨坊。"
stringn 11 "若农场此刻空置，再指派一名新农夫前往。"
stringn 12 "建造一座蜂巢。"
stringn 13 "在蜂巢与水井之畔兴建酿酒坊。"
stringn 14 "将烘焙师转为酿酒师。"
