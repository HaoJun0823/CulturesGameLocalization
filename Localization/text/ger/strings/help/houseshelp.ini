stringn 23 "In der Schreinerei 1 kann ein Werkzeugschreiner aus Holz Holzwerkzeuge herstellen, welche die Produktivit鋞 eines damit arbeitenden Wikingers erh鰄en. Sie sollte am Wasser gebaut werden, da in ihr zu einem sp鋞eren Zeitpunkt (Schreinerei 4) auch Schiffe hergestellt werden k鰊nen."
