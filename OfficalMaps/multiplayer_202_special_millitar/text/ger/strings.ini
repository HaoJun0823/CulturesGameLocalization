[text]
stringn 0 "DRACHENLAND I"
stringn 1 "5 Spieler: Die Drachen kommen regelmäßig aus ihren Höhlen, um Unheil über die Bevölkerung zu bringen! Die Wölfe im dichten Wald verhindern jede Flucht..."
stringn 2 "Du bist hier, um die Drachen wieder in ihren Höhlen einzusperren!"
stringn 3 "Generiere genügend Soldaten, um im Wolfswald nach verborgenen Schaltern zu suchen und sie zu betätigen. Die Schalter erscheinen in unregelmäßigen Abständen an ihren Positionen und schließen jeweils eine Tür einer Drachenhöhle."
stringn 5 "Verteidige dich gegen die Angriffe der Drachen, die dich häufig angreifen werden."
stringn 6 "Sind alle vier Drachenhöhlen verschlossen, ist die Mission für alle gewonnen."
