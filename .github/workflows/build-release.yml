# =============================================================================
# Cultures Saga — Build & Release Workflow
# =============================================================================
# Triggers:
#   - workflow_dispatch (manual)  ->  build + publish a release
#   - push to main                ->  build only, no release (verify integrity)
#
# Game data (map.dat, text/ger/ resources, sfx) is committed to mapdata/
# in the repo, so the build works on CI without external dependencies.
# See generate_mapdata.py to update mapdata/ from a local SAGA_GAME_HACK.
# =============================================================================

name: Build & Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag (e.g. v20260813-utf8)
        required: false
        type: string

  push:
    branches: [main]

permissions:
  contents: write
  actions: read

env:
  PYTHON_VERSION: '3.11'

jobs:
  build:
    name: Build & Release
    runs-on: windows-latest

    steps:
      # ---- Checkout --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      # ---- Python ----------------------------------------------------------
      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # ---- Build -----------------------------------------------------------
      - name: Build all languages
        shell: pwsh
        run: |
          python build_text.py --clean 2>&1

      # ---- Package ---------------------------------------------------------
      - name: Create release archive
        shell: pwsh
        run: |
          $date = Get-Date -Format "yyyyMMdd"
          $zipName = "CulturesGameLocalization_${date}_utf8.zip"
          $zipPath = "$env:RUNNER_TEMP/$zipName"

          Compress-Archive -Path "${{ github.workspace }}/_build/*" -DestinationPath $zipPath

          "ZIP_NAME=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ZIP_PATH=$zipPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $size = (Get-Item $zipPath).Length / 1MB
          Write-Host "Created: $zipName ($([math]::Round($size, 1)) MB)"

      # ---- Release (manual trigger only) -----------------------------------
      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ inputs.release_tag }}"
          if (-not $tag) {
            $date = Get-Date -Format "yyyyMMdd"
            $tag = "v${date}-utf8"
          }
          $zipName = "$env:ZIP_NAME"
          $zipPath = "$env:ZIP_PATH"

          $lines = @(
            "## Cultures Saga - Multi-language Build",
            "",
            "Date: $(Get-Date -Format "yyyy-MM-dd HH:mm")",
            "Languages: CHN (l10), ger, eng, pol",
            "Format: UTF-8",
            "",
            "### Contents",
            "- Data/maps/ - Main campaign maps with localized text",
            "- DataX/UserCampaigns/ - User campaign maps",
            "- Data/Text/ - Game system text (hypertext, encyclopedia)",
            "- DataX/FMV/ - Full-motion videos (when available)",
            ""
          )
          $body = $lines -join "`r`n"

          $existing = gh release view $tag --json name 2>$null
          if ($existing) {
            Write-Host "Release $tag already exists, uploading asset to it"
            gh release upload $tag "$zipPath#$zipName" --clobber
          } else {
            Write-Host "Creating release $tag"
            gh release create $tag "$zipPath#$zipName" --title "$tag" --notes "$body"
          }

      # ---- Upload artifact (always) ----------------------------------------
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_PATH }}
          retention-days: 30