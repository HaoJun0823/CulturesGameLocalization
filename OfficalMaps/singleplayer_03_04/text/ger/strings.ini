[text]
stringn 1 "Gehe auf Fischfang, um deine Leute zu ernähren und rüste sie mit Met aus."
stringn 2 "Suche die zwei Söldnercamps auf dem südwestlichen Kontinent auf."
stringn 3 "Zahle die Tribute an die Söldner, damit sie sich dir anschließen. Du solltest hier nur die wichtigsten Gebäude bauen."
stringn 4 "Wenn du selbst keine Schiffe herstellen möchtest, kannst du sie auch bei den Campführern per Tribut ordern."
stringn 5 "Versuche, deine Heimatinsel von den Piraten zu befreien. Du solltest jeden Mann mitnehmen, der zur Verfügung steht."
stringn 6 "Finde die Expedition, die sich vor Jahren in den Norden aufmachte, um ihn zu erforschen."
stringn 7 "Hilf dem gesamten Drachenvolk des Nordens, seine Freiheit wieder zu erlangen. Dafür mußt du VIER Lager befreien."
stringn 9 "@BEFREIE ALLE GEFANGENEN FRAUEN DEINES STAMMES."
stringn 10 "Man wird dich nun im Expeditionslager willkommen heißen."
stringn 11 "Wenn du des Kampfes müde bist, dann nimm das Angebot der Piraten an - zahle das geforderte Lösegeld."
stringn 12 "Öffne den Zugang zum Piratenreich."
stringn 13 "Du mußt deine Heimatinsel von den Piraten befreien, da du hier sonst keine Verbündeten findest."
