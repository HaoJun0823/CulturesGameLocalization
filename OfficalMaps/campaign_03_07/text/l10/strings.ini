stringn 98 "在帝王谷，吉萨金字塔的外壁须以白裳覆裹、打磨光滑，方能如巨晶般在阳光下熠熠生辉。我们须借尼罗河三个月的泛滥之机行事。然而即便是我们，亦难免敌袭……"
stringn 99 "吉萨金字塔"