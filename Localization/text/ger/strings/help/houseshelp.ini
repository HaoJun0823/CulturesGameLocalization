stringn 1 "Ein Hauptquartier ist die Basis eines jeden Dorfes und dient der Lagerung von Waren sowie der religi鰏en Motivation. Hauptquartiere k鰊nen nicht gebaut nur gesetzt werden. Hingegen anderer Geb鋟de kann sich ein Hauptquartier gegen Angreifer verteidigen."
