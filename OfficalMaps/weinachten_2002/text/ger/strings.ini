stringn 99 "*LEISE RIESELT DER SCHNEE..."
stringn 98 "Im Land der Eskimos schlagen die Wikinger erneut ihre Zelte auf. Doch die Bewohner haben große Sorgen. Die verschiedenen Stämme führen gegeneinander Krieg und Regen bedroht ihre Existenz…"