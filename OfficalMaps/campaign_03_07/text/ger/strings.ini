stringn 99 "DIE PYRAMIDEN VON GIZEH"
stringn 98 "Im Tal der Könige sollten die Außenflächen der Pyramiden von Gizeh weiß verkleidet und geglättet werden, um wie Riesenkristalle in der Sonne zu leuchten. Wir mussten die drei Überschwemmungsmonate des Nils dazu nutzen. Doch waren auch wir nicht gefeit vor feindlichen Übergriffen..."