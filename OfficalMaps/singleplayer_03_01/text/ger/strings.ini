[text]
stringn 0 "Suche den Druiden deines Stammes auf!"
stringn 1 "Bau das Gold ab und präge daraus Münzen, damit der Druide Tränke produzieren kann!"
stringn 2 "Finde den Stamm der Kameltreiber, der früher hier sein Wasser bezog!"
stringn 3 "Finde heraus, was mit der Wasserkarawane geschehen ist!"
stringn 4 "Sprich mit dem Häuptling der Oasenbauer!"
stringn 5 "Liefere dem Stamm der Oasenbauer 50 Wasser, und beschütze deine Händler vor den Wüstenräubern!"
stringn 6 "Suche den Tempel in der Stadt auf!"
stringn 7 "Baue ein Schiff und belade es mit Wasser!"
stringn 8 "Suche das Orakel per Schiff mit Bjarni und Mannschaft auf!"
stringn 9 "Entlade das Schiff und triff dich mit dem Orakelwächter!"
stringn 10 "BEFREIE DIE TRANSPORTKAMELE UND BEZWINGE DEN STAMM DER WÜSTENRÄUBER! ODER SUCHE NACH EINEM ANDEREN WEG."
stringn 11 "@BEFREIE DAS WASSERORAKEL!"
