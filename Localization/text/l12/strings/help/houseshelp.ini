[text]
stringn 1 "本拠地はすべての村の基礎であり、物品の貯蔵と宗教的動機づけの役目をします。本拠地は建造できず、据え置きのみです。他の建物と異なり、本拠地は攻撃者に対して防御することができます。"
stringn 2 "住宅1には最大で1家族(父、母、子)が住めます。ここに住む男性のための寝場所です。この家に女性が住んでいれば、すべての住人に食料を供給します。ここに住む結婚した夫婦は子どもを設けることができます。"
stringn 3 "住宅2には最大で2つの家族(それぞれ父・母・子)が住めます。男性がここに住むための寝室です。女性がここに住んでいる場合、全住人に食料を補給します。夫婦がここで生活していれば子供をもうけることができます。"
stringn 4 "住宅3では最大3家族(それぞれ夫・妻・子)が住めます。この住まいはここに住む男性の睡眠所です。この家に女性が住んでいれば、住人のみんなに食料を提供します。ここに住む夫婦は子どもを育てることができます。"
stringn 5 "住居4は最大4家族(それぞれ夫、妻、子)を収容できます。ここに住む男性の睡眠の場として機能します。この家に女性が住んでいれば、その女性が全住民に食料を提供します。この場所に暮らす結婚した夫婦は子供を設けられます。"
stringn 6 "住宅5には最大で5家族(それぞれ父・母・子)が暮らせます。ここに住む男性の寝場所として役立ちます。この家に女性が住んでいれば、すべての居住者に食料を供給します。ここに住む夫婦は子供を授かることができます。"
stringn 7 "倉庫1は最小の倉庫であり、物品を納めます。需要があれば、必要な商品はヴァイキングがこの倉庫に取りにきます。商品ごとに、最低在庫量と希望在庫量を設定できます。この倉庫に運搬人や商人が割り当てられると、彼らは常に希望する在庫量を補充しようとします。"
stringn 8 "倉庫2は物品の収納を目的としています。需要が発生すれば、必要な商品がヴァイキングによってここで保管されます。商品ごとに最小必要量と希望在庫量を設定できます。倉庫に運搬人や商人を割り当てると、彼らは常に希望の在庫を目指そうとします。"
stringn 9 "倉庫3は商品の貯蔵に役立します。需要の時には、ヴァイキングが必要な商品をこの倉庫に取りにきます。商品ごとに最低在庫と希望する在庫を設定できます。この倉庫に運搬人または商売人が割り当てられると、彼らは常に希望する在庫を維持しようとします。"
stringn 10 "井戸は自ら水を生産します。そこに割り当てられた運搬人は水を製パン所や醸造所、錬金術師の小屋などの必要な作業現場に運びます。"
stringn 11 "蜂の巣では、勤勉な蜜蜂たちが蜂蜜を供給しています。運搬人は蜂蜜を製パン所や醸造所に運び、ケーキや蜂蜜酒を作ることができます。"
stringn 12 "農場の近くの肥沃な地面に、1人または複数の農民が小麦を栽培できます。この穀物は製粉所で小麦粉を作るために、さらにいくつかの建物の屋根の建材として必要です。この建物の土台は貧しい土地でも問題ありませんが、その隣の農民の畑は水分と緑に満ちた土地を必要とします。"
stringn 13 "風で回るこの製粉所では、小麦から小麦粉を挽きます。完成した小麦粉は袋に詰められ、製粉所の前に保管され、おいしいパンを作るための基盤となります。"
stringn 14 "製パン所では、おいしいパンが焼かれます。パン屋は粉屋が提供する小麦粉と、井戸から運ばれてくる水を使います。"
stringn 15 "製パン所2では、おいしいケーキが焼かれます。この建物は、ヴァイキングが必要な技術と原料を備えれば建設可能です。費用と建築スペースを節約するために、製パン所1を製パン所2へ拡張することもできます。"
stringn 16 "醸造所では、醸造師がピリッと風味な蜂蜜酒を仕込みます。そのために彼は蜂蜜と水を必要とします。"
stringn 17 "畜産農は牧場から出て、庭の近くを歩き回る動物たちに向かいます。重要：繁殖のための基本群を維持するには、羊または牛を斥候が発見しなければなりません。羊は羊毛と肉を提供し、牛は革と肉を提供します。"
stringn 18 "裸足のヴァイキングはだれでも、革の靴を望むものです。これらの靴は縫製工房1で作られます。靴を履けば、ヴァイキングは速く歩くことができます。"
stringn 19 "縫工房2では、羊毛と革から革鎧と防御服を作り、兵士たちの衣服と保護の役を果たします。"
stringn 20 "陶芸工房1では、粘土からレンガを成形して焼きます。レンガは多くの建物の建材として必要です。"
stringn 21 "陶芸工房2では、瓦の製造を担います。瓦は粘土から形成し焼かれます。瓦は多くの建物の屋根の建材として必要です。"
stringn 22 "陶芸工房3では、粘土から芸術品と心地よい手作業で、心を込めて食器が作られて焼かれます。食器があれば、ヴァイキングの食事は倍の美味しさと感じされ、食欲はより長い間満たされます。"
stringn 23 "大工工房1では、大工が木から木製の道具を作ります。木製の道具は使うヴァイキングの生産性を上げます。工房は水のそばに建ててください。なぜなら、後ほど(大工工房4)同じ場所で船も製造できるようになるからです。"
stringn 24 "大工工房2では、1人または数人の大工が木材からヴァイキングの住居用の家具を作ります。将来的には(大工工房4)この場所でも船舶が作られるよう、水のそばに建築されるべきです。"
stringn 25 "この大工工房3では、1人あるいは数人の大工が木から木の槍と手押し車を製作します。後で(大工工房4)船も作れるよう、この工房は水際に建設しましょう。"
stringn 26 "牛車と交易船はこの大工工房4で木材から製作できます。船も製造されるため、必ず水際に建ててください。"
stringn 27 "武器工房1では、武器商人が木材から短弓と長弓を製作できます。"
stringn 28 "武器工房2では、武器商人が木から投石機を製作できます。"
stringn 29 "石工は、石工小屋1の周辺の広場で砕石を探し、それを石のブロックに加工します。そのため、この建物は砕石の近くに建てる必要があります。"
stringn 30 "1人または数人の石が周囲を砕石して探索し、石工小屋2でその石を大理石に加工します。この建物は砕石の近くに建てるべきです。"
stringn 31 "鍛冶場1では、鍛冶屋が鉄工具を作り、使うヴィキングの生産性を上げます。また鉄の投げ槍と短剣も兵士のためにここで鍛えられます。"
stringn 32 "鍛冶場2では、武器鍛冶が鉄から剣を鍛えます。鍛冶の炎を絶やさないために、十分な量の木材が必要です。戦闘中の兵士を守る鉄の鎧もここで生産されます。"
stringn 33 "鋳造師はここで金からコインを作り出すことができます。銭造の火を保つためには、十分な木材が必要です。コインは交易と賛納支払いのための人気の手段とされています。"
stringn 34 "薬草収集者は、自分の小屋の周囲を野草を探します。見つからない場合は、特別な薬草を自分で栽培します。それは栄養薬、癒しの薬、戦闘薬の作成の基盤となります。この建物の土地は不毛でも構いませんが、その隣にある薬草園は水分と豊かさのある緑地でなければなりません。"
stringn 35 "小さな錬金術師の小屋では、ドルイドがキノコから特別な油を醸造し、本拠地とヴァイキングの住居の前で焚かれる聖火の燃料となります。採集人は周辺で野生のキノコを見つけ、彼が働けるよう、ドルイドに届けましょう。"
stringn 36 "大きな錬金術師の小屋は、ヴァイキングに養・癒・戦闘のポーションを装備するために必要です。これらの調合にはキノコや油だけでなく、水、薬草、そして金も必要です。"
stringn 37 "神殿は宗教的動機付けのために働きます。神殿は聖火の魔法を周囲の環境に放射する唯一の建物で、したがってその動機を必要とする作業場、すなわち武器商人と鍛冶屋の近くに建てるべきです。"
stringn 38 "学校では、時間のかかる職業実習を省略して、事前知識なしでヴァイキングは新しい職業を学ぶことができます。条件は、その職業をすでに自分たちのいずれかのヴィキングができることです。"
stringn 39 "兵舎では、男性ヴァイキングが異なるカテゴリの兵士として募集できます。兵舎に装備を持ち込むために、最低でも一人の運搬人がそこではたはずです。"
stringn 40 "ヴァイキングが配置された小型の防衛塔は、近づく敵を自動で迎撃します。その射程と防御力を高めるために、最大3名の長弓手と3名の短弓手を配置できます。"
stringn 41 "ヴァイキングが配置された大きな防衛塔は、近づいてくる敵を自動的に撃退します。その射程と防御力を拡大するために、最大4名の長弓兵と4名の短弓兵を配置することが可能です。"