stringn 0 "@在以弗所兴建阿尔忒弥斯神庙。"
stringn 1 "建立一座小型聚落。"
stringn 2 "前往神庙工地。"
stringn 3 "设法排退沼泽、加固神庙工地。"
stringn 4 "向神庙工地运送 127 根大理石柱。"
stringn 5 "向港口民缴纳 15 单位铁制工具作贡金。"
stringn 6 "向士兵缴纳 15 单位蜂蜜酒作贡金，换取其支援。"
stringn 7 "寻找阿梅利亚。"
stringn 8 "将阿梅利亚送回双亲身边。"
stringn 9 "寻得年幼的希罗斯特拉特斯，将其关入地牢。"
stringn 10 "向商人缴纳 15 单位蜂蜜作贡金。"
stringn 11 "与你的英雄前往山中秘道！"
stringn 12 "与你的英雄进入沼泽中的泽地！"
stringn 14 "与你的英雄返回阿尔忒弥斯神庙！"
stringn 15 "再向将军的士兵缴纳 50 单位蜂蜜酒，换取其支援。"
