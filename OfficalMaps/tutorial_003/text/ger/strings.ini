[text]
stringn 0 "Weise einem Wikinger den Beruf des Lehmabbauers zu."
stringn 1 "Weise zwei Wikingern den Beruf des Holzabbauers und des Steinabbauers zu."
stringn 2 "Mache als nächstes einige deiner Männer, die noch keine Arbeit haben, zu Bauarbeitern!"
stringn 3 "Lass deine Bauarbeiter eine Farm bauen!"
stringn 4 "Weise der Farm einen deiner Leute als Farmer zu und warte bis er Meister wird."
stringn 5 "Baue eine Mühle."
stringn 6 "Mache den Farmer nun zum Müller."
stringn 7 "Baue einen Brunnen."
stringn 8 "Baue eine Bäckerei."
stringn 9 "Mache den Müller zum Bäcker."
stringn 10 "Weise der Mühle wieder einen Müller zu."
stringn 11 "Sollte die Farm nun leer stehen, weise ihr einen neuen Farmer zu."
stringn 12 "Baue einen Bienenstock."
stringn 13 "Errichte nun die Brauerei in die Nähe des Bienenstocks und des Brunnens."
stringn 14 "Mache den Bäcker zum Braumeister."
