[text]
stringn 1 "水は地中からくみ上げられ、運搬人がそれをパン屋、醸造所、錬金術師の小屋などの必要な作業場へ運びます。"
stringn 2 "粘土は、生産を粘土に設定された採集人によって採掘されます。"
stringn 3 "砕石は、生産を砕石に設定された採集人によって岩塊から切り出されます。"
stringn 4 "小麦は農民が肥沃な土地で育てます。小麦は粉屋で粉を作るのに必要で、畜産家にとっては飼料として、また建物の建材として使われます。"
stringn 5 "木材は採集人によって伐採されます。生産は木材に設定されています。"
stringn 6 "鉄は、生産を鉄に設定した経験豊富な採集人によって採掘されます。"
stringn 7 "金は、生産を金に設定した経験豊富な採集人によって採掘されます。"
stringn 8 "金貨は金から作られ、ヴァイキングの間で人気のある交易品です。"
stringn 9 "皮革は狩人が森の動物（鹿、野猪など）から、または牧畜農家が牧場の牛から得ます。"
stringn 10 "羊毛は牧畜農家が羊から得ます。"
stringn 11 "粉屋が農家の小麦を挽いて麦粉を作ります。"
stringn 12 "蜂蜜は勤勉な蜂から得られます。運搬人は蜂蜜をパン屋か醸造屋へ運び、そこでケーキや蜂蜜酒の製造に使われます。"
stringn 13 "薬草は薬草採取人によって採集され、乾燥させて貯蔵されます。薬草は錬金術師の小屋2で、栄養・治療・戦闘用ポーションの製造の基盤となります。"
stringn 14 "キノコは採集人によって集められ、ドルイドによって油に加工することができます。"
stringn 15 "油はドルイドが、採集人が集めたキノコから作ります。この油はすべての住居の前に聖火を灯すために必要です。"
stringn 16 "食料はすべてのヴァイキングに必要です。そのため、機能する食料供給はミッションの成功に欠かせません。食料は狩人、漁師、パン屋、畜産農によって生産されます。"
stringn 17 "ケーキは特殊な食料で、ヴァイキングの食欲を長い間満たし、さらに社会的欲求も下げてくれます。ケーキは製パン所2で焼かれます。"
stringn 18 "どのヴァイキングもベリーの茂みから果物を収穫できます。果物はしばらくの間、空腹を和らげます。"
stringn 19 "パンはパン屋が焼きます。そのために、製粉所の小麦粉と井戸の水が必要です。"
stringn 20 "ケーキは特殊な食料で、ヴァイキングの食欲を長い間満たし、さらに社会的欲求も下げてくれます。ケーキは製パン所2で焼かれます。"
stringn 21 "肉は狩人が森の動物から、または畜産農が牛や羊から得ます。"
stringn 22 "魚は漁師が釣り上げ、ヴァイキングの基本的な食料の一つです。"
stringn 23 "ソーセージは畜産農が羊と牛から作り、ヴァイキングの基本的な食料の一つです。"
stringn 43 "蜂蜜酒は醸造師によって仕込まれます。そのためには蜂蜜と水が必要です。"
stringn 24 "レンガは陶工が粘土から焼きます。粘土に加えて、燃料としての木材が必要です。レンガは多くの建物の建材として必要です。"
stringn 25 "瓦は陶工が粘土から焼きます。粘土に加えて、燃料としての木材が必要です。瓦は高級な建物の屋根の建材として必要です。"
stringn 26 "石ブロックは石工が砕石から切り出します。建物の建材として必要です。"
stringn 27 "大理石は石工が石ブロックから作ります。高級な建物の建材として必要です。"
stringn 28 "食器は陶工が粘土から焼きます。焼くためには木材が必要です。食器があれば、女性が料理をし、その食料の量を倍にできます。"
stringn 29 "家具は大工が木から作ります。家に住む女性は、自分で家具を引き取ります。家具があると住居の快適さが上がります。なぜならベッドでは、固い床よりも快適に眠れるからです。これによりヴァイキングはより休め、より長く目覚めていられます。"
stringn 30 "裸足のヴァイキングは、皆に革の靴を望みます。靴を履けばヴァイキングはより速く移動し、その際のエネ量も少なくなります。"
stringn 31 "木製の道具は道具大工が木材から製造します。それを使うヴァイキングの生産性を高めます。"
stringn 32 "鉄製の道具は鍛冶屋が鉄から製造します。それを使うヴァイキングの生産性を大幅に高めます。"
stringn 33 "布の胴鎧は羊毛と革から作られます。兵士の衣服と防御の用に用します。特に矢からの防御に優れていますが、剣の斬撃と投石機には弱いです。"
stringn 34 "革の鎧は革から作られます。兵士が衣服として着用し、長剣と投石機を除くあらゆる種類の武器に対して高い丸防御を誇ります。"
stringn 35 "鎖帷子は鉄から作られます。兵士の衣服として用され、装着者をほぼすべての武器から守ります。ただし鉄の槍と投石機にはやや弱いです。"
stringn 36 "板金鎧は鉄から作られます。兵士たちの衣服および防御の用に兼ねます。鎧として望める最高のもので、投石機に対しても持ち主を守ってくれます。"
stringn 37 "短弓は、武器職人が木から作ります。離れた敵を攻撃するのに優れた武器です。射程と貫通力のバランスが取れています。"
stringn 38 "長弓は、武器職人が木から作ります。遠距離から敵を攻撃するのに最高の武器です。射程と貫通力は優れています。"
stringn 39 "木槍は、大工が木から作ります。木の槍は中間距離の単純な接近戦武器です。"
stringn 40 "鉄槍は、鍛冶屋が硬い鉄の穂先を取り付けた木の槍です。そのために鉄と木の槍が必要です。鉄槍は中間距離の接近戦に適した武器です。"
stringn 41 "短剣は、鍛冶屋が鉄から鍛造されます。短剣は近い射程とまあまあの貫通力を備えた接近戦武器です。"
stringn 42 "長剣は、鍛冶屋が鉄から鍛冶で作られます。長剣は中距離の射程と高い貫通力を持つ接近戦武器です。投石機には特に効果が高い武器です。"
stringn 44 "小さな栄養ポーションは、大きな錬金術師の小屋で、ドルイドが水・薬草・キノコ・秘密の材料から作ります。英雄を除くすべての男性ヴァイキングがこのポーションを装備できます。お腹が鳴るときに自動で2回使用し、食物なしでより長い道のりを走破できます。使用後、ポーションは使い切れになります。秘密で非常に貴重な材料のため、ドルイドはさらに黄金を必要とします。"
stringn 45 "大きな栄養ドランは、大きな錬金術師の小屋で、ドルイトが水・薬草・キノコ・秘密の材料から作ります。英雄以外のすべての男性ヴァイキングに装備させられます。腹が減ると自動で5回使用して、食料なしでより長い移動が可能です。ポーションは使用後に消費されます。秘密で極めて希な材料にはドルイトにはさらに黄金が必要です。"
stringn 46 "小さいスタミナドランは、大きな錬金術師の小屋でドルドが水・薬草・キノコ・秘密の材料から調合されます。英雄以外のすべての男性ヴァイキンがこのドランを装備できます。疲労が襲うと自動で2回使用し、より長く起きていて行動し続けることができます。秘密で非常に希少な材料のために、ドルイドはさらに黄金を必要とします。"
stringn 47 "大きなスタミナポーションは、大きな錬金術師の小屋で、ドルドが水・薬草・キノコ・秘密の材料から作られています。英雄を除くすべての男性ヴァイキングに装備できます。疲労が訪れると自動で5回使用、起きて行動できる時間がより長くなります。非常に珍しく秘密な材料のため、ドルドにはさらに黄金が必要です。"
stringn 48 "小さな回復ポーションは、大きな錬金術師の小屋で、ドルドが水・薬・キノコ・秘密の原料から作られ、英雄以外の男性ヴァイキングが装備できます。野獣や敵と戦って負傷すると、自動で2回使用します。秘密の極めて珍しい材料にはドルドがさらに黄金を必要とします。"
stringn 49 "大きな回復薬は、大きな錬金術師の小屋で、ドルイドが水・薬草・キノコ・秘密の材料から作ります。英雄を除くすべての男性ヴァイキングが装備できます。野獣や敵との戦闘で負傷すると、自動で5回使用します。秘密で極めて希少な材料のために、ドルイダにはさらに黄金が必要です。"
stringn 50 "栄養のお守りは、所有者を飢から守ります。お守りは製造できず、発見するか、他民族との交易で入手するしかありません。女性と英雄以外のすべてのヴァイキングが装着できます。お守りは消耗しません。"
stringn 51 "スタミナの護符は、疲労から身を守ります。これは製できず、他民族との貿易で発見するほか入手することはできません。女性と英雄を除くすべてのヴァイキングはこの護符を身につけることができます。消耗することはありません。"
stringn 52 "力の護符は、攻撃時の持ち主の強さを50%高めます。製造はできず、発見や他民の貿易で入手できます。女性と英雄を除くヴァイキングなら全員が装着可能。護符は消耗しません。"
stringn 53 "防御の護符は、猛獣や敵対民族の攻撃を弱め、その者の健康を保護します。お守りは作ることができず、発見されるかまたは外国民族との交で入手します。女性や英雄を除いたすべてのヴァイキングに装備できます。消耗しません。"
stringn 54 "命中の護符は、20パーセントの確率で野生の動物や敵への攻撃力を倍にします。作ることはできず、他民族の貿易や発見でのみ手に入ります。女性と英雄以外のヴァイキングはみな装身できます。消耗することはありません。"
stringn 55 "風の護符は持ち主に速さを加え、より速く移動することができます。お守りは製造できず、発見や異国との交易でのみ入手できます。女性と英雄以外のすべてのヴァイキングが装着可能です。消耗されません。"
stringn 56 "狩人の戦利品には、肉、革、羊毛が含まれます。"
stringn 57 "羊"
stringn 58 "牛"