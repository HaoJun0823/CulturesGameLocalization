stringn 0 "@ERRICHTE DIE ZEUSSTATUE AM TEMPEL!"
stringn 1 "Suche und vereine dein Volk."
stringn 2 "Errichte zwischen den Händlerlagerhäusern ein eigenes Lagerhaus!"
stringn 3 "Gehe zum Bauplatz."
stringn 4 "Bringe 80 Gold zum Bauplatz der Statue."
stringn 5 "Gehe nach Elis."
stringn 6 "Finde das verborgene Elfenbein und die seltenen Edelmetalle."
stringn 7 "Bringe den Korinthern ein Artefakt ihres Glaubens."
stringn 8 "Finde den Läufer von Olympia und trete gegen ihn ein Wettrennen an."
stringn 9 "Bringe die Völker zur Zusammenarbeit, gehe mit Elisern nach Sparta!"
stringn 10 "Zahle den Händler 15 Schalen Honig als Tribut für weitere Waren."
stringn 11 "Zahle den Nomaden 15 Langschwerter als Tribut."
stringn 12 "Bringe 40 Marmorsäulen zum Bauplatz der Statue."
stringn 13 "Gehe mit allen deinen Helden und einem Elisersoldaten zur Kaserne."
stringn 14 "Gehe mit deine Helden zurück zum Bauplatz der Statue!"
stringn 15 "Erkunde Sparta, du hast nun die Erlaubnis hierzu!"
stringn 16 "Für diesen Tribut erhältst du einen Hand- und einen Ochsenkarren:"
stringn 17 "Für diesen Tribut erhältst du 15 Nahrungsamulette:"
