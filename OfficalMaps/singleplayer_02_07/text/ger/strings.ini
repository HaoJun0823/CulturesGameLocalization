[text]
stringn 0 "Bekämpfe deine Gegner, oder mache dir einfach nur das Land zunutze!"
stringn 1 "Zahle den drei Stämmen ihren Tribut, damit sie sich dir anschließen!"
stringn 3 "Um friedlich zu siegen, schaffe mehr als die Hälfte(10) der hier aufgelisteten Waren in entsprechender Stückzahl in deine Lager:                GRUNDRESSOURCEN:                                                                                          500 Lehm, Stein, Holz, Weizen, Kuchen, Eisen, Gold,                               1000 Nahrung;                                                                                  ERWEITERTE WAREN:                                                                                       500 Mehl, Holzwerkzeug,                                                                          300 Backstein, Steinblöcke, Möbel, Wolle, Schuhe,                                            200 Dachziegel, Marmor, Eisenwerkzeug, Münzen!"
stringn 4 "Um auf weniger diplomatischem Weg zu siegen, vernichte alle drei Gegner!"
stringn 110 "Zahle folgenden Tribut, damit sich der Stamm dir anschließt:"
stringn 10 "Dein Stamm"
stringn 11 "Dein Stamm"
stringn 20 "Plattländer"
stringn 21 "Platt"
stringn 30 "Helluländer"
stringn 31 "Hellu"
stringn 40 "Markländer"
stringn 41 "Mark"
stringn 99 "ZEIT DER KOLONIALISIERUNG"
stringn 98 "Mache dir das Land zu Eigen oder vertreibe deine Gegner! Dies wird einmal das Land deiner Wikingerkolonie sein!"