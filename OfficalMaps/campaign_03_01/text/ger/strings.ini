[text]
stringn 0 "Suche einen geeigneten Landeplatz."
stringn 1 "Baue eine kleine Siedlung auf."
stringn 2 "Bringe 100 Bruchsteine und 50 Marmorblöcke zum Leuchtturm."
stringn 3 "Begib dich auf die Suche nach dem Architekten Sostratos und befreie ihn."
stringn 4 "Zahle den Vagabunden 120 Münzen und 10 Met oder bekämpfe sie."
stringn 5 "Zahle den Vagabunden die geforderten Waren:"
stringn 6 "Durchsuche das Vagabundenlager."
stringn 7 "Bringe Sostratos zum Leuchtturm."
stringn 8 "Finde das heilige Feuer."
stringn 9 "Zahle dem Bergvolk 15 große Heiltränke Tribut oder bekämpfe sie."
stringn 10 "Bringe das Feuer mit einem Helden zum Leuchtturm."
stringn 11 "Handele mit den Wikingern 5 Langschwerter."
stringn 12 "@BEFESTIGE DEN LEUCHTTURM VON PHAROS!"
stringn 13 "Reiche den Wikingern 10 Verteidigungsamulette zum Tribut."
stringn 14 "Errichte ein Lagerhaus in der Nähe des Leuchtturmes."
stringn 15 "Öffne die Tore und gelange mit allen Helden zum Eingang der Bergwerke."
stringn 16 "Gelange mit ALLEN Helden zum Eingang des Berges!"
stringn 19 "Zahle den Nomaden 15 große Heiltränke Tribut."
