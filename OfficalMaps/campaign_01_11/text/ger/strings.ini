stringn 99 "WIGRID WALL"
stringn 98 "Wie von Zauberhand stranden die Wikinger nach einer langen Irrfahrt eines Morgens an einer toten, verbrannten Küste. Dies musste das Ziel sein, das Reich der Midgardschlange - Wigrid Wall!"