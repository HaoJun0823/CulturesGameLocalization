[text]
stringn 1 "Ein Hauptquartier ist die Basis eines jeden Dorfes und dient der Lagerung von Waren sowie der religiösen Motivation. Hauptquartiere können nicht gebaut nur gesetzt werden. Hingegen anderer Gebäude kann sich ein Hauptquartier gegen Angreifer verteidigen."
stringn 2 "Im Wohnhaus 1 kann höchstens eine Familie wohnen (Mann, Frau, Kind). Es dient einem hier wohnenden Mann als Schlafstätte. Wohnt in diesem Haus eine Frau, versorgt sie alle Bewohner mit Nahrung. Ein hier lebendes, verheiratetes Paar kann Kinder bekommen."
stringn 3 "Im Wohnhaus 2 können höchstens zwei Familien (jeweils Mann, Frau, Kind) wohnen. Es dient einem hier wohnenden Mann als Schlafstätte. Wohnt in diesem Haus eine Frau, versorgt sie alle Bewohner mit Nahrung. Ein hier lebendes, verheiratetes Paar kann Kinder bekommen."
stringn 4 "Im Wohnhaus 3 können höchstens drei Familien (jeweils Mann, Frau, Kind) wohnen. Es dient einem hier wohnenden Mann als Schlafstätte. Wohnt in diesem Haus eine Frau, versorgt sie alle Bewohner mit Nahrung. Ein hier lebendes, verheiratetes Paar kann Kinder bekommen."
stringn 5 "Im Wohnhaus 4 können höchstens vier Familien (jeweils Mann, Frau, Kind) wohnen. Es dient einem hier wohnenden Mann als Schlafstätte. Wohnt in diesem Haus eine Frau, versorgt sie alle Bewohner mit Nahrung. Ein hier lebendes, verheiratetes Paar kann Kinder bekommen."
stringn 6 "Im Wohnhaus 5 können höchstens fünf Familien (jeweils Mann, Frau, Kind) wohnen. Es dient einem hier wohnenden Mann als Schlafstätte. Wohnt in diesem Haus eine Frau, versorgt sie alle Bewohner mit Nahrung. Ein hier lebendes, verheiratetes Paar kann Kinder bekommen."
stringn 7 "Das Lagerhaus 1 ist das kleinste Lagerhaus und dient der Unterbringung von Waren. Herrscht Bedarf, werden benötigte Waren von den Wikingern hier im Lagerhaus abgeholt. Pro Ware können Mindestvorrat und gewünschter Lagerbestand eingestellt werden. Sind dem Lagerhaus Träger oder Händler zugewiesen, versuchen diese, immer auf den gewünschten Lagerbestand aufzufüllen."
stringn 8 "Das Lagerhaus 2 dient der Unterbringung von Waren. Herrscht Bedarf, werden benötigte Waren von den Wikingern hier im Lagerhaus abgeholt. Pro Ware können Mindestvorrat und gewünschter Lagerbestand eingestellt werden. Sind dem Lagerhaus Träger oder Händler zugewiesen, versuchen diese, immer auf den gewünschten Lagerbestand aufzufüllen."
stringn 9 "Das Lagerhaus 3 dient der Unterbringung von Waren. Herrscht Bedarf, werden benötigte Waren von den Wikingern hier im Lagerhaus abgeholt. Pro Ware können Mindestvorrat und gewünschter Lagerbestand eingestellt werden. Sind dem Lagerhaus Träger oder Händler zugewiesen, versuchen diese, immer auf den gewünschten Lagerbestand aufzufüllen."
stringn 10 "Der Brunnen produziert eigenständig Wasser. Ein dort zugewiesener Träger bringt es dann an die benötigte Arbeitsstelle, wie die Bäckerei, die Brauerei oder die Alchemistenhütte."
stringn 11 "Im Bienenstock liefern fleißige Bienen Honig. Ein Träger kann den Honig zur Bäckerei oder in die Brauerei bringen, damit diese dann Kuchen bzw. Met herstellen."
stringn 12 "In der Nähe der Farm, auf fruchtbarem Boden können ein oder mehrere Farmer Weizen anpflanzen. Man braucht das Getreide in der Mühle für die Herstellung von Mehl und als Bauware für die Dächer einiger Gebäude. Der Bauuntergrund für dieses Gebäude kann durchaus karg sein, aber die Felder der Farmer daneben verlangen nach saftigen, grünen Boden."
stringn 13 "In dieser vom Wind betriebenen Mühle wird aus Weizen Mehl gemahlen. Das fertige Mehl wird in Säcke gefüllt, vor der Mühle gelagert und bildet die Grundlage für die Herstellung von leckerem Brot."
stringn 14 "In der Bäckerei wird leckeres Brot gebacken. Dazu verwendet der Bäcker Mehl vom Müller und Wasser, welches aus einem Brunnen herangeholt wird."
stringn 15 "In der Bäckerei 2 wird leckerer Kuchen gebacken. Diese Bäckerei kann gebaut werden, wenn die Wikinger über die nötigen Technologien und Rohstoffe verfügen. Um Kosten und Bauplatz zu sparen, kann die Bäckerei 1 zur Bäckerei 2 ausgebaut werden."
stringn 16 "In der Brauerei wird würziger Met vom Braumeister angesetzt. Dazu benötigt er Honig und Wasser."
stringn 17 "Ein Viehzüchter läuft von der Viehzüchterei aus zu Tieren, die in der Nähe des Hofes umherstreifen. WICHTIG: Um einen Grundbestand zur Züchtung zu erhalten, müssen Schafe oder Rinder von einem KUNDSCHAFTER gefunden werden. Die Schaffe liefern Wolle und Fleisch und die Rinder liefern Leder und Fleisch."
stringn 18 "Jeder barfüssige Wikinger hätte gern ein paar Schuhe aus Leder. In der Näherei 1 werden diese hergestellt. Mit Schuhen an den Füssen bewegen sich die Wikinger schneller fort."
stringn 19 "In der Näherei 2 werden Lederrüstungen und Waffenröcke aus Wolle und Leder hergestellt, die den Soldaten als Kleidung und zum Schutz dienen."
stringn 20 "In der Töpferei 1 werden Backsteine aus Lehm geformt und gebrannt. Man benötigt sie als Bauware für viele Gebäude."
stringn 21 "Die Töpferei 2 ist für die Herstellung von Dachziegeln zuständig. Diese werden aus Lehm geformt und gebrannt. Man benötigt sie als Bauware für die Dächer vieler Gebäude."
stringn 22 "In der Töpferei 3 wird aus Lehm kunstvoll in liebevoller Handarbeit Geschirr geformt und gebrannt. Mit Geschirr schmeckt den Wikingern ihr Essen gleich doppelt so gut und ihr Appetit bleibt längere Zeit gestillt."
stringn 23 "In der Schreinerei 1 kann ein Werkzeugschreiner aus Holz Holzwerkzeuge herstellen, welche die Produktivität eines damit arbeitenden Wikingers erhöhen. Sie sollte am Wasser gebaut werden, da in ihr zu einem späteren Zeitpunkt (Schreinerei 4) auch Schiffe hergestellt werden können."
stringn 24 "In der Schreinerei 2 stellen ein oder mehrere Schreiner aus Holz Möbel für die Wohnhäuser der Wikinger her. Sie sollte am Wasser gebaut werden, da in ihr zu einem späteren Zeitpunkt (Schreinerei 4) auch Schiffe hergestellt werden können."
stringn 25 "Hier in der Schreinerei 3 stellen ein oder mehrere Schreiner Holzspeere und Handkarren aus Holz her. Sie sollte am Wasser gebaut werden, da in ihr zu einem späteren Zeitpunkt (Schreinerei 4) auch Schiffe hergestellt werden können."
stringn 26 "Ochsenkarren und Handelschiffe können hier in der Schreinerei aus Holz gefertigt werden. Sie sollte am Wasser gebaut werden, da in ihr auch Schiffe hergestellt werden können."
stringn 27 "Ein Waffenbauer kann in der Waffenhütte 1 aus Holz Bogen und Langbogen herstellen. "
stringn 28 "In der Waffenhütte 2 kann ein Waffenbauer aus Holz Katapulte herstellen."
stringn 29 "Ein Steinmetz sucht die Umgebung der Steinmetzhütte 1 nach Bruchstein ab und verarbeitet ihn zu Steinblöcken. Das Gebäude sollte deshalb in der Nähe von Bruchstein errichtet werden."
stringn 30 "Ein oder mehrere Steinmetze suchen die Umgebung nach Bruchstein ab und verarbeiten sie in der Steinmetzhütte 2 zu Marmor. Das Gebäude sollte deshlalb in der Nähe von Bruchstein errichtet werden."
stringn 31 "In der Schmiede 1 kann ein Schmied Eisenwerkzeuge herstellen, welche die Produktivität eines damit arbeitenden Wikingers erhöhen. Aber auch Eisenspeere und Kurzschwerter werden hier für die Soldaten geschmiedet."
stringn 32 "Ein Waffenschmied kann in der Schmiede 2 aus Eisen Schwerter schmieden. Um das Schmiedefeuer in Gang zu halten, wird ausreichend Holz benötigt. Hier werden auch eiserne Rüstungen hergestellt, die den Soldaten als Schutz im Kampf dienen."
stringn 33 "Ein Münzpräger kann hier aus Gold Münzen prägen. Um das Prägefeuer in Gang zu halten, wird ausreichend Holz benötigt.Die Münzen gelten als ein beliebtes Mittel für Handel und Tributzahlungen."
stringn 34 "Ein Kräutersammler sucht die Umgebung der Kräuterhütte nach wildwachsenden Pflanzen ab und wenn er keine findet, baut er besondere Kräuterpflanzen selbst an. Diese dienen als Grundlage für die Herstellung von Versorgungs-, Heil-, und Kampftränken. Der Bauuntergrund für dieses Gebäude kann durchaus karg sein, aber die Gärten der Kräutersammler daneben verlangen nach saftigen, grünen Boden."
stringn 35 "In der kleinen Alchemistenhütte braut ein Druide aus Pilzen besonderes Öl, welches Brennmittel für das heilige Feuer ist, das vor dem Hauptquartier und vor den Wohnhäusern der Wikinger entzündet werden kann. Ein Abbauer sollte die Umgebung nach wildwachsenden Pilzen absuchen und dem Druiden bringen, damit dieser arbeiten kann."
stringn 36 "Die große Alchemistenhütte ist nötig, um die Wikinger mit Versorgungs-, Heil-, und Kampftränken auszustatten. Für die Herstellung dieser werden nicht nur Pilze und Öl gebraucht, sondern auch Wasser, Kräuter und Gold."
stringn 37 "Der Tempel dient der religiösen Motivation. Er ist das einzige Gebäude, welches die Magie des heiligen Feuers an die Umgebung abstrahlt und sollte folglich in der Nähe von Berufsstätten gebaut werden, die auf dies Motivation angewiesen sind, also in die Nähe von Waffenbauer und Schmied."
stringn 38 "In der Schule können Wikinger neue Berufe ohne zeitraubende Berufspraxis und folglich ohne Vorkenntnisse erlernen. Voraussetzung ist, dass der Beruf von einen ihrer Wikinger bereits ausführbar ist."
stringn 39 "In einer Kaserne können männliche Wikinger zu Soldaten rekrutiert werden. Um die Ausrüstungsgegenstände in die Kaserne zu bekommen, sollte dort mindestens ein Träger arbeiten."
stringn 40 "Ein mit Wikingern besetzter kleiner Wachturm verteidigt sich automatisch gegen nahe Feinde. Er kann mit maximal 3 Lang- und 3 Kurzbogenschützen besetzt werden, um Reichweite und Verteidigungskraft zu erhöhen."
stringn 41 "Ein mit Wikingern besetzter großer Wachturm verteidigt sich automatisch gegen nahe Feinde. Er kann mit maximal 4 Lang- und 4 Kurzbogenschützen besetzt werden, um Reichweite und Verteidigungskraft zu erhöhen."