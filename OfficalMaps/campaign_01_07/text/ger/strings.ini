stringn 99 "DIE SCHLACHT UM BYZANZ"
stringn 98 "Der General hatte die Kontrolle über die Armee an sich gerissen und den nördlichen Teil von Byzanz erobert. Nun würde es auf die Warägergarde ankommen, wohin sich die Waagschale des Schicksals senken wird."