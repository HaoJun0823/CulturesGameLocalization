stringn 0 "Besiege den verräterischen General."
stringn 1 "Erobere die letzte Festung des Generals im nördlichen Gebirge."
stringn 2 "Zahle den Tribut, um den General friedlich zu stimmen."
stringn 3 "Gehe in dein Dorf."
stringn 21 "Zahle den gewünschten Tribut für einen Handelsvertrag."
stringn 22 "Stimme die Byzantiner wieder friedlich."
