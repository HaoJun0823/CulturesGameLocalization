[text]
stringn 1 "Wasser wird aus der Tiefe der Erde gefördert und ein Träger bringt es dann an die benötigte Arbeitsstelle, wie die Bäckerei, die Brauerei oder die Alchemistenhütte."
stringn 2 "Lehm wird von Abbauern abgebaut, deren Produktion auf Lehm eingestellt ist."
stringn 3 "Bruchstein wird von Abbauern, deren Produktion auf Bruchstein eingestellt ist, aus Felsbrocken gehauen."
stringn 4 "Weizen wird von Farmern auf fruchtbaren Boden angebaut. Man braucht den Weizen in der Mühle für die Herstellung von Mehl, beim Viehzüchter als Futter und als Bauware für Gebäude."
stringn 5 "Holz wird von Abbauern gefällt, deren Produktion auf Holz eingestellt ist. "
stringn 6 "Eisen wird von erfahrenen Abbauern gefördert, deren Produktion auf Eisen eingestellt ist"
stringn 7 "Gold wird von erfahrenen Abbauern gefördert, deren Produktion auf Gold eingestellt ist"
stringn 8 "Münzen werden aus Gold hergestellt und sind eine beliebte Handelsware der Wikinger."
stringn 9 "Leder gewinnen die Jäger von den Tieren des Waldes (Rehe, Wildschweine...) oder die Viehzüchter von den Rindern in der Viehzüchterei."
stringn 10 "Wolle gewinnen die Viehzüchter von den Schafen."
stringn 11 "Mehl wird vom Müller aus dem Weizen des Farmers gemahlen."
stringn 12 "Honig erhält man von den fleißigen Bienen. Ein Träger kann den Honig zur Bäckerei oder zur Brauerei bringen, wo er zur Herstellung von Kuchen oder Met verwendet wird."
stringn 13 "Kräuter werden vom Kräutersammler gesammelt, getrocknet und gelagert. Sie dienen als Grundlage zur Herstellung von Versorgungs-, Heil-, und Kampftränken in der Alchemistenhütte 2. "
stringn 14 "Pilze werden von Abbauern gesammelt und können von einem Druiden zu Öl verarbeitet werden."
stringn 15 "Öl stellt der Druide aus Pilzen her, die der Abbauer gesammelt haben. Es wird benötigt, um das Heilige Feuer vor jedem Wohnhaus zu entzünden."
stringn 16 "Nahrung wird von jedem Wikinger benötigt. Daher ist eine funktionierende Nahrungsversorgung unverzichtbar für den Erfolg einer Mission. Nahrung wird produziert von Jäger, Fischer, Bäcker und Viehzüchter."
stringn 17 "Kuchen ist eine besondere Nahrung, da er lange den Appetit eines Wikingers stillt und zusätzlich das soziale Bedürfnis senkt. Kuchen wird in der Bäckerei 2 gebacken."
stringn 18 "Früchte kann jeder Wikinger von den Beerenbüschen ernten. Beeren stillen den Hunger für eine kleine Weile."
stringn 19 "Brot backt der Bäcker. Er benötigt dazu Mehl aus der Mühle und Wasser vom Brunnen."
stringn 20 "Kuchen ist eine besondere Nahrung, da er lange den Appetit eines Wikingers stillt und zusätzlich das soziale Bedürfnis senkt. Kuchen wird in der Bäckerei 2 gebacken."
stringn 21 "Fleisch gewinnt der Jäger von den Tieren des Waldes oder der Viehzüchter von Rindern und Schafen."
stringn 22 "Fisch wird vom Fischer geangelt und gehört zur einfachen Nahrung der Wikinger."
stringn 23 "Wurst wird vom Viehzüchter aus Schafen und Rindern gefertigt und gehört zur einfachen Nahrung der Wikinger."
stringn 43 "Met wird vom Braumeister angesetzt. Dazu benötigt er Honig und Wasser."
stringn 24 "Backsteine werden vom Töpfer aus Lehm gebrannt. Außer Lehm braucht er dazu Holz als Brennmaterial. Man benötigt Backsteine als Bauware für viele Gebäude."
stringn 25 "Dachziegel werden vom Töpfer aus Lehm gebrannt. Außer Lehm braucht er dazu Holz als Brennmaterial. Man benötigt Dachziegeln als Bauware für die Dächer hochwertiger Gebäude."
stringn 26 "Steinblöcke werden vom Steinmetz aus Bruchstein gehauen. Man benötigt sie als Bauware für Gebäude."
stringn 27 "Marmor wird vom Steinmetz aus Steinblöcken gefertigt. Man benötigt Marmor als Bauware für hochwertige Gebäude."
stringn 28 "Geschirr wird vom Töpfer aus Lehm gebrannt. Für das Brennen wird Holz benötigt. Mit Geschirr können Frauen das Essen kochen und dadurch die Menge der Nahrung verdoppeln."
stringn 29 "Möbel werden vom Schreiner aus Holz gefertigt. Frauen, die in einem Haus wohnen, holen sich die Möbel von alleine ab. Mit Möbeln steigt der Wohnkomfort, denn in einem Bett schläft es sich angenehmer als auf hartem Boden. Dadurch sind die Wikinger ausgeruhter und bleiben länger wach."
stringn 30 "Jeder barfüssige Wikinger hätte gern ein paar Schuhe aus Leder. Mit Schuhen an den Füssen bewegen sich die Wikinger schneller fort und verbrauchen weniger Energie dabei."
stringn 31 "Holzwerkzeuge werden von einem Werkzeugschreiner aus Holz hergestellt. Sie erhöhen die Produktivität eines damit arbeitenden Wikingers."
stringn 32 "Eisenwerkzeuge können von einem Schmied aus Eisen hergestellt werden. Sie erhöhen die Produktivität eines damit arbeitenden Wikingers stark."
stringn 33 "Waffenröcke werden aus Wolle und Leder hergestellt. Sie dienen den Soldaten als Kleidung und zum Schutz. Sie schützen besonders gut vor Pfeilen, sind aber anfällig gegen Schwerthiebe und Katapulte."
stringn 34 "Lederrüstungen werden aus Leder hergestellt. Sie dienen den Soldaten als Kleidung und sind ein recht guter Rundum Schutz gegen alle Arten von Waffen, außer gegen Langschwerter und Katapulte."
stringn 35 "Kettenhemden werden aus Eisen hergestellt. Sie dienen den Soldaten als Kleidung und schützen den Träger gegen fast alle Arten von Waffen. Gegen Eisenspeere und Katapulte sind sie allerdings etwas anfällig."
stringn 36 "Plattenrüstungen werden aus Eisen hergestellt. Sie dienen den Soldaten als Kleidung und zum Schutz. Sie sind die beste Rüstung, die man sich wünschen kann und bieten dem Träger sogar Schutz gegen Katapulte."
stringn 37 "Kurzbogen werden bei dem Waffenbauer aus Holz hergestellt. Sie sind eine gute Waffe, um Feinde aus der Distanz anzugreifen. Reichweite und Durchschlagskraft sind ausgewogen."
stringn 38 "Langbogen werden bei dem Waffenbauer aus Holz hergestellt. Sie sind eine hervorragende Waffe, um Feinde aus großer Distanz anzugreifen. Reichweite und Durchschlagskraft sind ausgezeichnet."
stringn 39 "Holzspeere werden aus Holz von einem Schreiner hergestellt. Ein Holzspeer ist eine einfache Nahkampfwaffe mit mittlerer Reichweite."
stringn 40 "Eisenspeere sind Holzspeere, die vom Schmied mit einer harten Eisenspitze versehen werden. Dazu benötigt er Eisen und einen Holzspeer. Ein Eisenspeer ist eine gute Nahkampfwaffe mit mittlerer Reichweite."
stringn 41 "Kurzschwerter werden vom Schmied aus Eisen geschmiedet. Ein Kurzschwert ist eine Nahkampfwaffe mit geringer Reichweite und mäßiger Durchschlagskraft."
stringn 42 "Langschwerter werden aus Eisen vom Schmied geschmiedet. Ein Langschwert ist eine Nahkampfwaffe mit mittlerer Reichweite und hoher Durchschlagskraft. Besonders effektiv kann man es gegen Katapulte einsetzen."
stringn 44 "Kleine Nahrungstränke werden vom Druiden in der großen Alchemistenhütte aus Wasser, Kräuter, Pilzen und geheimen Zutaten hergestellt. Alle männlichen Wikinger außer den Helden können mit diesen Tränken ausgerüstet werden. Sie benutzen sie zweimal automatisch, wenn ihr Magen knurrt, und können somit längere Strecken ohne Nahrung auskommen. Danach sind die Tränke verbraucht. Für die geheimen und höchst seltenen Zutaten benötigt der Druide zusätzlich Gold."
stringn 45 "Große Nahrungstränke werden vom Druiden in der großen Alchemistenhütte aus Wasser, Kräuter, Pilzen und geheimen Zutaten hergestellt. Alle männlichen Wikinger außer den Helden können mit diesen Tränken ausgerüstet werden. Sie benutzen sie fünfmal automatisch, wenn ihr Magen knurrt, und können somit längere Strecken ohne Nahrung auskommen. Für die geheimen und höchst seltenen Zutaten benötigt der Druide zusätzlich Gold."
stringn 46 "Kleine Wachtränke werden vom Druiden in der großen Alchemistenhütte aus Wasser, Kräuter, Pilzen und geheimen Zutaten hergestellt. Alle männlichen Wikinger außer den Helden können mit diesen Tränken ausgerüstet werden. Sie benutzen sie zweimal automatisch, wenn sie die Müdigkeit überkommt, und können somit längere Zeit wach und damit aktiv bleiben. Für die geheimen und höchst seltenen Zutaten benötigt der Druide zusätzlich Gold."
stringn 47 "Große Wachtränke werden vom Druiden in der großen Alchemistenhütte aus Wasser, Kräuter, Pilzen und geheimen Zutaten hergestellt. Alle männlichen Wikinger außer den Helden können mit diesen Tränken ausgerüstet werden. Sie benutzen sie fünfmal automatisch, wenn sie die Müdigkeit überkommt, und können somit längere Zeit wach und damit aktiv bleiben. Für die geheimen und höchst seltenen Zutaten benötigt der Druide zusätzlich Gold."
stringn 48 "Kleine Heiltranke werden vom Druiden in der großen Alchemistenhütte aus Wasser, Kräuter, Pilzen und geheimen Zutaten hergestellt. Alle männlichen Wikinger außer den Helden können mit diesen Tränken ausgerüstet werden. Sie benutzen sie zweimal automatisch, wenn sie im Kampf mit wilden Tieren oder Gegnern verletzt werden. Für die geheimen und höchst seltenen Zutaten benötigt der Druide zusätzlich Gold."
stringn 49 "Große Heiltranke werden vom Druiden in der großen Alchemistenhütte aus Wasser, Kräuter, Pilzen und geheimen Zutaten hergestellt. Alle männlichen Wikinger außer den Helden können mit diesen Tränken ausgerüstet werden. Sie benutzen sie fünfmal automatisch, wenn sie im Kampf mit wilden Tieren oder Gegnern verletzt werden. Für die geheimen und höchst seltenen Zutaten benötigt der Druide zusätzlich Gold."
stringn 50 "Ein Nahrungsamulett schützt den Träger vor Hunger. Es kann nicht hergestellt, aber gefunden und im Handel mit Völkern erworben werden. Alle Wikinger, bis auf Frauen und Helden, können dieses Amulett tragen. Es verbraucht sich nie."
stringn 51 "Ein Wachbleibamulett schützt den Träger vor Müdigkeit. Es kann nicht hergestellt, aber gefunden und im Handel mit Völkern erworben werden. Alle Wikinger, bis auf Frauen und Helden können dieses Amulett tragen. Es verbraucht sich nie."
stringn 52 "Ein Stärkeamulett erhöht die Stärke des Trägers beim Angriff um 50 Prozent. Es kann nicht hergestellt, aber gefunden und im Handel mit Völkern erworben werden. Alle Wikinger, bis auf Frauen und Helden können dieses Amulett tragen. Es verbraucht sich nie."
stringn 53 "Ein Verteidigungsamulett schwächt Angriffe wilder Tiere und feindlicher Völker ab und schützt damit die Gesundheit des Trägers. Es kann nicht hergestellt, aber gefunden und im Handel mit Völkern erworben werden. Alle Wikinger, bis auf Frauen und Helden können dieses Amulett tragen. Es verbraucht sich nie."
stringn 54 "Ein Trefferamulett verdoppelt mit einer Wahrscheinlichkeit von 20 Prozent die Stärke des Trägers bei Angriffen auf wilde Tiere und Feinde. Es kann nicht hergestellt, aber gefunden und im Handel mit Völkern erworben werden. Alle Wikinger, bis auf Frauen und Helden können dieses Amulett tragen. Es verbraucht sich nie."
stringn 55 "Ein Windamulett verleiht dem Träger Geschwindigkeit und er kann sich somit schneller fortbewegen. Es kann nicht hergestellt, aber gefunden und im Handel mit Völkern erworben werden. Alle Wikinger, bis auf Frauen und Helden können dieses Amulett tragen. Es verbraucht sich nie."
stringn 56 "Zu der Beute eines Jägers zählen Fleisch, Leder und Wolle. "
stringn 57 "Schaf"
stringn 58 "Rind"